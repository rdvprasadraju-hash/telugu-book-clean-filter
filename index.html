<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>సార్వత్రిక తెలుగు అక్షర క్లీనర్ v112.0</title>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #212529; }
  .box { width: 100%; max-width: 850px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
  h2 { text-align: center; color: #0f5132; margin-top: 0; font-size: 24px; font-weight: 700; }
  textarea { width: 100%; height: 210px; padding: 12px; font-size: 16px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; resize: vertical; }
  textarea:focus { border-color: #0f5132; outline: none; }
  .output { background: #fffdf5; border: 1px solid #fce8b2; min-height: 210px; padding: 15px; font-size: 18px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; line-height: 1.8; color: #1a1a1a; }
  .btn-container { display: flex; gap: 10px; margin-top: 15px; }
  button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-clean { background: #0f5132; }
  .btn-clean:hover { background: #146c43; }
  .btn-clean:disabled { background: #6c757d; cursor: not-allowed; }
  .status { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; border: 1px solid #badbcc; }
</style>
</head>
<body>

<div class="box">
  <h2>📚 సార్వత్రిక తెలుగు అక్షర క్లీనర్ v112.0 (మ్యాథ్స్ ఈక్వేషన్ ప్రొటెక్షన్ ఎడిషన్)</h2>
  <div id="statusBox" class="status"></div>
  <textarea id="in" placeholder="కంటెంట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
  
  <div class="btn-container">
    <button id="cleanBtn" class="btn-clean" onclick="runSoftwarePipeline()">✨ అన్ని తప్పులను సరిచేయి</button>
    <button style="background:#0d6efd; color:white; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer;" onclick="copyCleanedContent()">📋 టెక్స్ట్ కాపీ చేయి</button>
  </div>
  
  <div id="out" class="output">సరిదిద్దబడిన స్పష్టమైన తెలుగు కంటెంట్ ఇక్కడ కనిపిస్తుంది...</div>
</div>

<script>
// 🧠 లోకల్ కోర్ నిఘంటువు (OCR స్పెల్లింగ్ తప్పుల ఆటోమేటిక్ కరెక్షన్)
const SYSTEM_CORE_DICT = {
  "అధ్వయయిం": "అధ్యాయం",
  "అధ్యాయిం": "అధ్యాయం",
  "గొప": "గొప్ప"
};

// 🌐 నెట్‌వర్క్ బైపాస్ గేట్‌వే (CORS ఎర్రర్స్ లేకుండా లైవ్ అనువాదాన్ని తెస్తుంది)
async function requestLiveTranslation(wordPayload) {
  try {
    let targetUrl = `https://googleapis.com\${encodeURIComponent(wordPayload)}`;
    let response = await fetch(targetUrl);
    let matrixData = await response.json();
    
    if (matrixData && matrixData[0]) {
      let combinedTranslation = "";
      for (let i = 0; i < matrixData[0].length; i++) {
        if (matrixData[0][i] && matrixData[0][i][0]) {
          combinedTranslation += matrixData[0][i][0];
        }
      }
      if (combinedTranslation.trim().length > 0) return combinedTranslation.trim();
    }
  } catch (netError) {
    console.error("Gateway Sync Error: ", netError);
  }
  return wordPayload; 
}

async function runSoftwarePipeline() {
  let userInput = document.getElementById("in").value;
  if (!userInput.trim()) {
    alert("దయచేసి టెక్స్ట్ బాక్స్‌లో కంటెంట్ పేస్ట్ చేయండి!");
    return;
  }

  let processBtn = document.getElementById("cleanBtn");
  let outputPanel = document.getElementById("out");
  let statusBox = document.getElementById("statusBox");
  
  processBtn.innerText = "⏳ సాఫ్ట్‌వేర్ రన్ అవుతోంది...";
  processBtn.disabled = true;
  statusBox.style.display = "block";
  statusBox.innerText = "🔍 ఈక్వేషన్స్ ని కాపాడుతూ, మిక్స్డ్ భాషల పదాలను పూర్తిగా తెలుగులోకి మారుస్తోంది...";

  // 1. యూనికోడ్ నార్మలైజేషన్
  let architectureText = userInput.normalize("NFC");

  // 2. విడిపోయిన హల్లులు, గుణింత గుర్తుల మధ్య ఉన్న స్పేస్‌ల క్లీనప్
  let stateCheckpoint;
  do {
    stateCheckpoint = architectureText;
    architectureText = architectureText.replace(/([\u0C00-\u0C7F])\s+([\u0C3E-\u0C4D\u0C01-\u0C03\u0C55\u0C56])/gu, '\$1\$2');
  } while (architectureText !== stateCheckpoint);

  // 3. ర-వత్తులు మరియు క్లిష్టమైన తెలుగు లోపాల ప్రాథమిక రీ-జాయినింగ్
  architectureText = architectureText.replace(/ర\s*్\s*ా/gu, "్రా");
  architectureText = architectureText.replace(/ర\s*్\s*ి/gu, "్రి");
  architectureText = architectureText.replace(/ర\s*్\s*ే/gu, "్రే");
  architectureText = architectureText.replace(/ర\s*్\s*ో/gu, "్రో");
  architectureText = architectureText.replace(/ర\s*్\s*సా\s*రు/gu, "రాశారు");
  architectureText = architectureText.replace(/శ\s*క్\s*్\s*తి/gu, "శక్తి");
  architectureText = architectureText.replace(/జీ\s*వి\s*త\s*్\s*ో\s*్\s*ని/gu, "జీవితాన్ని");
  architectureText = architectureText.replace(/ప్ర\s*క\s*ృ\s*తి\s*ని/gu, "ప్రకృతిని");
  architectureText = architectureText.replace(/ప్ర\s*శ\s*్\s*న\s*లు/gu, "ప్రశ్నలు");
  architectureText = architectureText.replace(/చె\s*ప్\s*ప\s*ా\s*ల\s*ి/gu, "చెప్పాలి");
  architectureText = architectureText.replace(/ఉ\s*జ\s*్\s*జ\s*్వ\s*ల\s*ం\s*గా/gu, "ఉజ్జ్వలంగా");
  architectureText = architectureText.replace(/చే\s*యా\s*లి/gu, "చేయాలి");

  // 4. ఇంటెలిజెంట్ సిలబుల్ మెర్జర్ (స్పేస్‌లు ఉన్న తెలుగు ముక్కలను కలపడం)
  let initialTokens = architectureText.split(/(\s+)/);
  for (let idx = 0; idx < initialTokens.length; idx++) {
    if (/\s+/.test(initialTokens[idx])) continue;
    let lookAheadIdx = idx + 2;
    if (lookAheadIdx < initialTokens.length) {
      let current = initialTokens[idx];
      let forward = initialTokens[lookAheadIdx];
      let isTelCurrent = /^[\u0C00-\u0C7F]+\$/.test(current.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      let isTelForward = /^[\u0C00-\u0C7F]+\(/.test(forward.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      
      if (isTelCurrent && isTelForward) {
        if (current.length <= 2 || forward.length <= 2 || ["లు","ని","తో","అని","ను"].includes(forward)) {
          initialTokens[idx] = current + forward;
          initialTokens[lookAheadIdx] = "";
          initialTokens[idx + 1] = ""; 
          idx -= 2;
          if (idx < -1) idx = -1;
        }
      }
    }
  }
  architectureText = initialTokens.join("");

  // 5. 🔥 🌐 హోల్-వర్డ్ మల్టీ-లాంగ్వేజ్ & మ్యాథ్స్ ప్రొటెక్షన్ ఇంజన్
  let wordsArray = architectureText.split(/(\s+)/);
  for (let i = 0; i < wordsArray.length; i++) {
    let activeWord = wordsArray[i];
    
    if (activeWord.trim().length > 0 && !/\s+/.test(activeWord)) {
      let cleanWord = activeWord.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
      
      // 🛡️ కండిషన్ 1 [మ్యాథ్స్ ఈక్వేషన్ లాక్]: ఒకవేళ పదం లోపల గణిత గుర్తులు లేదా నెంబర్లు ఉంటే (ఉదా: E=mc^2, 2x+3y=5, a+b=c, 100)
      // సిస్టమ్ దీనిని అస్సలు టచ్ చేయదు, అలాగే వదిలేస్తుంది!
      if (/[\d+\-*\/=^<>]/.test(activeWord)) {
        continue; 
      }
      
      // 🛡️ కండిషన్ 2 [ఇంగ్లీష్ లాక్]: పదం పూర్తిగా ప్యూర్ ఇంగ్లీష్ (a-z, A-Z) అక్షరాలతో ఉంటే అలాగే ఉంచుతుంది
      if (/^[a-zA-Z]+\$/.test(cleanWord)) {
        continue; 
      }
      
      // కండిషన్ 3 [అన్యభాషా క్రాష్ ఇంజన్]: పదం లోపల తెలుగు కాకుండా మరేదైనా విదేశీ స్క్రిప్ట్ మిక్స్ అయినా
      // ఆ మొత్తం పదాన్ని (Whole Word) క్లౌడ్ నిఘంటువుకు పంపి ప్యూర్ తెలుగులోకి మారుస్తుంది.
      if (/[\u0900-\u097F\u0400-\u04FF\u0600-\u06FF\u4e00-\u9fa5]/u.test(cleanWord)) {
        statusBox.innerText = `🌐 మిక్స్డ్ పదాన్ని పూర్తిగా మారుస్తోంది: ${cleanWord}...`;
        let fullyTranslatedWord = await requestLiveTranslation(activeWord);
        wordsArray[i] = fullyTranslatedWord;
      }
    }
  }
  architectureText = wordsArray.join("");

  // 6. కోర్ స్టాటిక్ డిక్షనరీ రిజల్యూషన్ (తెలుగు టైపోస్ ఫైనల్ టచ్)
  for (let errorPattern in SYSTEM_CORE_DICT) {
    let regexInstance = new RegExp(errorPattern, 'g');
    architectureText = architectureText.replace(regexInstance, SYSTEM_CORE_DICT[errorPattern]);
  }

  // డబుల్ స్పేస్ క్లీనప్
  architectureText = architectureText.replace(/\s+/g, " ");

  // అవుట్‌పుట్ ప్రదర్శన
  outputPanel.innerText = architectureText.trim();
  statusBox.innerText = "✨ సిస్టమ్ పైప్‌లైన్ ప్రాసెసింగ్ 100% విజయవంతమైంది!";
  processBtn.innerText = "✨ అన్ని తప్పులను సరిచేయి";
  processBtn.disabled = false;
}

function copyCleanedContent() {
  const textBuffer = document.getElementById("out").innerText;
  if(textBuffer.startsWith("సరిదిద్దబడిన")) return;
  navigator.clipboard.writeText(textBuffer).then(() => {
    alert("📋 కంటెంట్ విజయవంతంగా క్లిప్‌బోర్డ్‌లోకి కాపీ చేయబడింది!");
  });
}
</script>

</body>
</html>
