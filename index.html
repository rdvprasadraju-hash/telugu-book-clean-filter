<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>తెలుగు బుక్ లేఅవుట్ & క్లీన్ ఫిల్టర్</title>
<style>
body {
  font-family: sans-serif;
  padding: 20px;
  max-width: 850px;
  margin: auto;
  line-height: 1.6;
  background-color: #f9f9f9;
  color: #333;
}
h2 {
  color: #004d40;
  border-bottom: 2px solid #004d40;
  padding-bottom: 8px;
}
textarea {
  width: 100%;
  height: 220px;
  box-sizing: border-box;
  padding: 12px;
  font-size: 16px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 4px;
}
button {
  padding: 12px 20px;
  margin: 5px 4px;
  font-size: 15px;
  cursor: pointer;
  background-color: #004d40;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
}
button:hover {
  background-color: #00796b;
}
.clear-btn {
  background-color: #d32f2f;
}
.clear-btn:hover {
  background-color: #f44336;
}
.info-box {
  background-color: #e0f2f1;
  padding: 10px 15px;
  border-left: 5px solid #004d40;
  margin-bottom: 15px;
  font-size: 14px;
}
</style>
</head>
<body>

<h2>📚 తెలుగు బుక్ లేఅవుట్ & క్లీన్ ఫిల్టర్</h2>

<div class="info-box">
  <strong>సక్రియ నియమాలు:</strong> డిక్షనరీ సవరణ | <strong>కొత్తది: తెలియని తప్పు పదాల పక్కన ⚠️ గుర్తు పెట్టడం</strong> | ఇంగ్లీష్ బ్రాకెట్ కంట్రోల్ | కేవలం 123 అంకెలు
</div>

<label><strong>రచయిత రఫ్ టెక్స్ట్ (Rough Manuscript):</strong></label>
<textarea id="rough" placeholder="మీ పుస్తకం టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>

<button onclick="processBookText()">బుక్ లేఅవుట్ క్లీన్ చేయి</button>
<button onclick="copyText()">క్లీన్ టెక్స్ట్ కాపీ చేయి</button>
<button class="clear-btn" onclick="clearText()">క్లియర్</button>

<label><strong>పబ్లిషింగ్ రెడీ టెక్స్ట్ (Ready for MS Word / InDesign):</strong></label>
<textarea id="clean" placeholder="లేఅవుట్ మరియు అక్షరదోషాలు సరిదిద్దబడిన టెక్స్ట్ ఇక్కడ కనిపిస్తుంది..."></textarea>

<script>
// ఆటోమేటిక్ స్పెల్ కరెక్షన్ డిక్షనరీ
const teluguSpellCheck = {
  "ఉందడం": "ఉండడం",
  "ఉందడము": "ఉండడము",
  "పుస్తక౦": "పుస్తకం",
  "చేసన": "చేసిన",
  "చయాలి": "చేయాలి"
};

function processBookText() {
  let text = document.getElementById("rough").value;
  if (!text) return;

  // PDF రెఫరెన్స్ లోని కామన్ టైపోస్ సవరణ
  text = text.replace(/డ\s+ジ\s+న\s+ల్స/g, "డిజిటల్");
  text = text.replace(/డ\s+జిటల్స/g, "డిజిటల్");
  text = text.replace(/డీఎస్ఏ/g, "డిఎన్ఏ");
  text = text.replace(/TRధిలో/g, "పరిధిలో");
  text = text.replace(/ఉద్Hoచ్చన్/g, "ఉద్భవించిన");

  let lines = text.split("\n");
  let cleanLines = [];

  for (let line of lines) {
    if (!line.trim()) {
      cleanLines.push("");
      continue;
    }

    let words = line.split(/\s+/);
    let processedWords = [];

    for (let i = 0; i < words.length; i++) {
      let word = words[i];
      if (!word) continue;

      // 1. తెలుగు అంకెలు ఉంటే తీసేయడం (రూల్ 2)
      if (/[\u0C66-\u0C6F]/u.test(word)) {
        word = word.replace(/[\u0C66-\u0C6F]/gu, "");
      }

      // 2. వింత గుర్తులను తీసేయడం, కేవలం స్టాండర్డ్ చిహ్నాలు (.,!?) ఉంచడం (రూల్ 3)
      word = word.replace(/[^\u0C00-\u0C7Fa-zA-Z0-9.,!?]/gu, "");

      if (!word) continue;

      // విరామ చిహ్నాలను వేరు చేయడం
      let cleanWord = word.replace(/[.,!?]/g, "");
      let punctuation = word.match(/[.,!?]/g) ? word.match(/[.,!?]/g).join("") : "";

      // 3. డిక్షనరీలో ఉన్న తప్పు పదాల సవరణ
      if (teluguSpellCheck[cleanWord]) {
        word = teluguSpellCheck[cleanWord] + punctuation;
      } 
      // 4. డిక్షనరీకి దొరకని సాధారణ తెలుగు టైపింగ్ తప్పులను గుర్తించడం (ఉదా: సున్నా తప్పుగా పడటం లేదా వింత అక్షర కలయికలు)
      else if (/[\u0C00-\u0C7F]/u.test(cleanWord)) {
        // తెలుగు టైపింగ్‌లో సాధారణంగా వచ్చే కొన్ని తప్పుల నమూనాలను (Patterns) బట్టి ⚠️ గుర్తు పెడుతుంది
        // ఉదాహరణకు: పదం మధ్యలో డబుల్ సున్నాలు రావడం, లేదా పొల్లు అక్షరం తప్పుగా మారడం
        if (/ంం|౦|౧|౨|౩|౫|౬|౭|౮|౯/.test(cleanWord) || (cleanWord.length > 2 && /[^ా-ూె-ోౌ్]ం/.test(cleanWord.slice(-2)))) {
          word = cleanWord + "⚠️[సరిచూసుకోండి]" + punctuation;
        }
      }

      // 5. ఇంగ్లీష్ పదాల బ్రాకెట్ రూల్ (రూల్ 1)
      let isEnglish = /^[a-zA-Z]+[.,!?]*$/.test(word);
      if (isEnglish) {
        let engWord = word.replace(/[.,!?]/g, "");
        if (i === 0) {
          word = engWord + punctuation;
        } else {
          word = "(" + engWord + ")" + punctuation;
        }
      }

      processedWords.push(word);
    }

    let cleanLine = processedWords.join(" ");
    cleanLine = cleanLine.replace(/\s+([.,!?])/g, "$1");
    cleanLines.push(cleanLine.trim());
  }

  document.getElementById("clean").value = cleanLines.join("\n");
}

async function copyText() {
  const output = document.getElementById("clean");
  if (!output.value) {
    alert("ముందుగా క్లీన్ బటన్ నొక్కండి.");
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    alert("పుస్తకం టెక్స్ట్ విజయవంతంగా కాపీ అయింది!");
  } catch (e) {
    output.focus();
    output.select();
    alert("టెక్స్ట్ సెలెక్ట్ అయింది. మన్యువల్‌గా Copy చేసుకోండి.");
  }
}

function clearText() {
  document.getElementById("rough").value = "";
  document.getElementById("clean").value = "";
}
</script>

</body>
</html>
