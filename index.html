<html lang="te">
<head>
<meta charset="UTF-8">

<title>తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v12.0</title>
<style>
  :root {
    --primary: #0f5132;
    --primary-hover: #146c43;

  }

    color: #212529;
    display: flex;
    flex-direction: column;

  header {
    background-color: var(--primary);
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; }

  .sidebar {
    width: 280px;
    background-color: white;
    border-right: 1px solid var(--border-color);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 15px;

  .panel-section {
    background-color: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
  }

    font-size: 15px;

    cursor: pointer;
    border: none;

    color: white;
  }
  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }
  .btn-info { background-color: #0d6efd; }

    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
    gap: 15px;

    font-size: 16px;
    line-height: 1.7;
    border: 1px solid var(--border-color);

    font-size: 19px;

    font-size: 32px;
    font-weight: bold;
    color: var(--primary);
    text-align: center;      /* పేజీ మధ్యలోకి అమరిక */
    margin-top: 30px;
    margin-bottom: 15px;
    display: block;
  }
  .book-heading {
    font-size: 26px;
    font-weight: bold;
    color: #198754;
    text-align: center;      /* పేజీ మధ్యలోకి అమరిక */
    margin-top: 20px;
    margin-bottom: 25px;
    display: block;
  }

    font-size: 22px;
    font-weight: bold;
    color: #343a40;
    margin-top: 20px;
    margin-bottom: 12px;
    display: block;
    border-left: 4px solid var(--primary);
    padding-left: 10px;
  }
  .book-paragraph {
    margin-bottom: 18px;
    text-align: justify;
  }
  @media print {
    body * { visibility: hidden; }
    #cleanContainer, #cleanContainer * { visibility: visible; }

  }
</style>

</header>

<div class="workspace">
  <div class="sidebar">
    <div class="panel-section">

      <div style="height: 8px;"></div>
      <button class="action-btn btn-secondary" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-info" onclick="window.print()">🖨️ పీడీఎఫ్ / ప్రింట్ తీయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-danger" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>
    </div>
  </div>

    </div>
  </div>

<textarea id="clean" style="display:none;"></textarea>

function saveDraft() { localStorage.setItem("rough_draft", document.getElementById("rough").value); }
window.onload = function() {
  let saved = localStorage.getItem("rough_draft");
  if(saved) { document.getElementById("rough").value = saved; }
};

function processBookPublishing() {
  let rawInput = document.getElementById("rough").value;
  if (!rawInput) return;

  rawInput = rawInput.replace(/⚠️\[సరిచూసుకోండి\]/g, "");

  // 🌟 (Reverse) Gravity లాంటి ముక్కలను ఒకే బ్రాకెట్ లోపలికి తెచ్చే లాజిక్
  rawInput = rawInput.replace(/(\b[a-zA-Z0-9\s]+\b)\s*\(([a-zA-Z0-9\s]+)\)\s*(\b[a-zA-Z0-9\s]+\b)/g, "($1 $2 $3)");
  rawInput = rawInput.replace(/(\b[a-zA-Z0-9\s]+\b)\s*\(([a-zA-Z0-9\s]+)\)/g, "($1 $2)");
  rawInput = rawInput.replace(/\(([a-zA-Z0-9\s]+)\)\s*(\b[a-zA-Z0-9\s]+\b)/g, "($1 $2)");

  let lines = rawInput.split("\n");
  let htmlOutput = [];
  let rawTextOutput = [];

  for (let line of lines) {
    let trimmedLine = line.trim();
    if (!trimmedLine) {
      htmlOutput.push("<br>");
      rawTextOutput.push("");
      continue;
    }

    // విడిపోయిన కొన్ని కామన్ బ్రోకెన్ ముక్కలు కలపడం
    line = line.replace(/ఊహ\s+ంచుకతందాం/g, "ఊహించుకుందాం");
    line = line.replace(/బిగ్\s+బ్యంగ్/g, "బిగ్ బ్యాంగ్");

    let words = line.split(/\s+/);
    let processedWords = [];

    for (let i = 0; i < words.length; i++) {
      let word = words[i];
      if (!word) continue;

      // పాత తెలుగు అంకెలను అంతర్జాతీయ అంకెలుగా మార్చడం
      word = word.replace(/[\u0C66-\u0C6F]/gu, function(ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
      });

      if (word.startsWith("(") || word.endsWith(")") || /\(.*\)/.test(word)) {
        processedWords.push(word);
        continue;
      }

      let cleanWord = word.replace(/[.,!?()]/g, "");
      let punctuationBefore = word.match(/^[(]*/) ? word.match(/^[(]*/) : "";
      let punctuationAfter = word.match(/[.,!?)]*$/) ? word.match(/[.,!?)]*$/) : "";

      if (spellingFixes[cleanWord]) {
        cleanWord = spellingFixes[cleanWord];
      }
      
      processedWords.push(punctuationBefore + cleanWord + punctuationAfter);
    }

    let cleanLine = processedWords.join(" ");
    cleanLine = cleanLine.replace(/[ \t]+/g, " "); 
    let finalLine = cleanLine.trim();
    
    rawTextOutput.push(finalLine);

    // 🌟 క్లీన్ అయిన ప్యూర్ టెక్స్ట్ ఆధారంగా అధ్యాయాలను కచ్చితంగా గుర్తుపట్టే సరికొత్త రూల్
    let isMainChapter = /^(అధ్యాయం|అధ్వయయిం|Chapter)/i.test(finalLine);
    let isBookHeading = /^(శీర్షిక|శీరిషిక|Title)/i.test(finalLine);
    let isSubHeading = /^(ఉప శీర్షిక|ఉపశీర్షిక|సూపర్ ఏఐ|అంతిమ|ఆమ|Sub|Section)/i.test(finalLine);

    if (isMainChapter) {
      htmlOutput.push("<span class='main-chapter'>" + finalLine + "</span>");
    } else if (isBookHeading) {
      htmlOutput.push("<span class='book-heading'>" + finalLine + "</span>");
    } else if (isSubHeading) {
      htmlOutput.push("<span class='sub-heading'>" + finalLine + "</span>");
    } else {
      htmlOutput.push("<div class='book-paragraph'>" + finalLine + "</div>");
    }
  }

  document.getElementById("cleanContainer").innerHTML = htmlOutput.join("");
