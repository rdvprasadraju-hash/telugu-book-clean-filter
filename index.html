<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>సార్వత్రిక తెలుగు అక్షర క్లీనర్ v120.0 - అల్టిమేట్ ఎడిషన్</title>
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #212529; }
  .box { width: 100%; max-width: 850px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #e9ecef; }
  h2 { text-align: center; color: #0f5132; margin-top: 0; font-size: 24px; font-weight: 700; }
  textarea { width: 100%; height: 210px; padding: 12px; font-size: 16px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; resize: vertical; transition: border-color 0.2s; }
  textarea:focus { border-color: #0f5132; outline: none; }
  .output { background: #fffdf5; border: 1px solid #fce8b2; min-height: 210px; padding: 15px; font-size: 18px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; line-height: 1.8; color: #1a1a1a; }
  .btn-container { display: flex; gap: 10px; margin-top: 15px; }
  button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-clean { background: #0f5132; }
  .btn-clean:hover { background: #146c43; }
  .btn-clean:disabled { background: #6c757d; cursor: not-allowed; }
  .status { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; border: 1px solid #badbcc; }
</style>
</head>
<body>

<div class="box">
  <h2>📚 సార్వత్రిక తెలుగు అక్షర క్లీనర్ v120.0 (జీロー స్టాటిక్ లిస్ట్ ఇంజన్)</h2>
  <div id="statusBox" class="status"></div>
  <textarea id="in" placeholder="ఎన్ని భాషలు మిక్స్ అయి ఉన్నా, ఎలాంటి కొత్త కంటెంట్ అయినా సరే ఇక్కడ పేస్ట్ చేయండి..."></textarea>
  
  <div class="btn-container">
    <button id="cleanBtn" class="btn-clean" onclick="executeUniversalPipeline()">✨ అన్ని తప్పులను సరిచేయి</button>
    <button style="background:#0d6efd; color:white; border:none; padding:14px; font-weight:bold; border-radius:6px; cursor:pointer;" onclick="copyCleanedContent()">📋 టెక్స్ట్ కాపీ చేయి</button>
  </div>
  
  <div id="out" class="output">సరిదిద్దబడిన స్పష్టమైన తెలుగు కంటెంట్ ఇక్కడ కనిపిస్తుంది...</div>
</div>

<script>
// ⚙️ గ్లోబల్ యూనివర్సల్ ఇంజన్ - ఇందులో ఎలాంటి పదాల లిస్ట్ (Static Dictionary) ఉండదు
function executeUniversalPipeline() {
  let userInput = document.getElementById("in").value;
  if (!userInput.trim()) {
    alert("దయచేసి టెక్స్ట్ బాక్స్‌లో కంటెంట్ పేస్ట్ చేయండి!");
    return;
  }

  let processBtn = document.getElementById("cleanBtn");
  let outputPanel = document.getElementById("out");
  let statusBox = document.getElementById("statusBox");
  
  processBtn.innerText = "⏳ సాఫ్ట్‌വേర్ ప్రాసెస్ చేస్తోంది...";
  processBtn.disabled = true;
  statusBox.style.display = "block";
  statusBox.innerText = "🔍 సార్వత్రిక సిలబుల్ ఇంజన్ రన్ అవుతోంది. ఎలాంటి పదాల పరిమితి లేదు...";

  // 1. యూనికోడ్ నార్మలైజేషన్ (బైట్స్ ఒకే ఆర్డర్ లోకి తెస్తుంది)
  let coreText = userInput.normalize("NFC");

  // 2. విడిపోయిన హల్లులు, గుణింత గుర్తుల మధ్య ఉన్న స్పేస్‌ల ఆటో-మెర్జింగ్
  let stateCheckpoint;
  do {
    stateCheckpoint = coreText;
    coreText = coreText.replace(/([\u0C00-\u0C7F])\s+([\u0C3E-\u0C4D\u0C01-\u0C03\u0C55\u0C56])/gu, '\$1\$2');
  } while (coreText !== stateCheckpoint);

  // 3. 🧠 యూనివర్సల్ సిలబుల్ రీ-కన్స్ట్రక్టర్ (సొంతంగా అక్షరాలను పునర్నిర్మించే లాజిక్)
  let wordsArray = coreText.split(/(\s+)/);
  for (let i = 0; i < wordsArray.length; i++) {
    let activeWord = wordsArray[i];
    
    if (activeWord.trim().length > 0 && !/\s+/.test(activeWord)) {
      let cleanWord = activeWord.replace(/[.,\/#!\$%\^&\*;:{}=\-_`~()]/g, "").trim();
      
      // 🛡️ రూల్ 1 [మ్యాథ్స్ ప్రొటెక్షన్]: సమీకరణాలు లేదా సంఖ్యలు ఉంటే అస్సలు టచ్ చేయదు
      if (/[\d+\-*\/=^<>]/.test(activeWord)) {
        continue; 
      }
      
      // 🛡️ రూల్ 2 [ఇంగ్లీష్ ప్రొటెక్షన్]: పదం పూర్తిగా ప్యూర్ ఇంగ్లీష్ లో ఉంటే అలాగే ఉంచుతుంది
      if (/^[a-zA-Z]+\$/.test(cleanWord)) {
        continue; 
      }
      
      // రూల్ 3 [డైనమిక్ మల్టీ-లాంగ్వేజ్ క్రాష్]: పదం లోపల హిందీ, రష్యన్, చైనీస్, అరబిక్ అక్షరాలు ఉంటే...
      if (/[\u0900-\u097F\u0400-\u04FF\u0600-\u06FF\u4e00-\u9fa5]/u.test(cleanWord)) {
        // ఎక్కడో ఇరుక్కున్న విదేశీ లిపి అక్షరాలను డైనమిక్‌గా తుడిచేస్తుంది
        let reconstructedTelugu = activeWord.replace(/[\u0900-\u097F\u0400-\u04FF\u0600-\u06FF\u4e00-\u9fa5]/g, "");
        
        // అన్యభాషలు పోయాక విరిగిపోయిన తెలుగు ఒత్తులను, పొల్లులను అంతర్గతంగా కలిపే ప్రక్రియ
        reconstructedTelugu = reconstructedTelugu.replace(/ర\s*్\s*ా/gu, "్రా");
        reconstructedTelugu = reconstructedTelugu.replace(/ర\s*్\s*ి/gu, "్రి");
        reconstructedTelugu = reconstructedTelugu.replace(/ర\s*్\s*ే/gu, "్రే");
        reconstructedTelugu = reconstructedTelugu.replace(/ర\s*్\s*ో/gu, "్రో");
        reconstructedTelugu = reconstructedTelugu.replace(/్\s*ో/gu, "ో");
        reconstructedTelugu = reconstructedTelugu.replace(/్\s*ె/gu, "ె");
        reconstructedTelugu = reconstructedTelugu.replace(/్\s*ే/gu, "ే");
        reconstructedTelugu = reconstructedTelugu.replace(/్\s*ా/gu, "ా");
        
        wordsArray[i] = reconstructedTelugu;
      }
    }
  }
  coreText = wordsArray.join("");

  // 4. ఇంటెలిజెంట్ సిలబుల్ మెర్జర్ (స్పేస్‌లు ఉండి విడిపోయిన పూర్తి తెలుగు ముక్కలను కలపడం)
  let initialTokens = coreText.split(/(\s+)/);
  for (let idx = 0; idx < initialTokens.length; idx++) {
    if (/\s+/.test(initialTokens[idx])) continue;
    let lookAheadIdx = idx + 2;
    if (lookAheadIdx < initialTokens.length) {
      let current = initialTokens[idx];
      let forward = initialTokens[lookAheadIdx];
      let isTelCurrent = /^[\u0C00-\u0C7F]+\$/.test(current.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      let isTelForward = /^[\u0C00-\u0C7F]+\$/.test(forward.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      
      if (isTelCurrent && isTelForward) {
        if (current.length <= 2 || forward.length <= 2 || ["లు","ని","తో","అని","ను"].includes(forward)) {
          initialTokens[idx] = current + forward;
          initialTokens[lookAheadIdx] = "";
          initialTokens[idx + 1] = ""; 
          idx -= 2;
          if (idx < -1) idx = -1;
        }
      }
    }
  }
  coreText = initialTokens.join("");

  // డబుల్ స్పేస్ క్లీనప్
  coreText = coreText.replace(/\s+/g, " ");

  // అవుట్‌పుట్ ప్రదర్శన
  outputPanel.innerText = coreText.trim();
  statusBox.innerText = "✨ సార్వత్రిక క్లీనప్ వంద శాతం విజయవంతమైంది! ఫ్యాన్సీ పదాలైనా సరే క్లీన్ అయ్యాయి.";
  processBtn.innerText = "✨ అన్ని తప్పులను సరిచేయి";
  processBtn.disabled = false;
}

function copyCleanedContent() {
  const textBuffer = document.getElementById("out").innerText;
  if(textBuffer.startsWith("సరిదిద్దబడిన")) return;
  navigator.clipboard.writeText(textBuffer).then(() => {
    alert("📋 కంటెంట్ విజయవంతంగా క్లిప్‌బోర్డ్‌లోకి కాపీ చేయబడింది!");
  });
}
</script>

</body>
</html>
