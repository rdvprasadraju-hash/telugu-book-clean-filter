function smartUnicodeRepair(text) {
  if (!text) return "";
  let repairedText = text.normalize("NFC");
  
  // 1. పాత తెలుగు అంకెలను అంతర్జాతీయ అంకెలుగా మార్చడం
  repairedText = repairedText.replace(/[\u0C66-\u0C6F]/g, function(ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
  });

  // 2. 🌟 స్ట్రాంగ్ క్యారెక్టర్ బైట్ ఫిక్సర్ (Wipes Hidden Russian/Cyrillic Mixed Codes)

  repairedText = repairedText.replace(/మ\s*[\u0440р]\s*[\u0438и]\s*య\s*ు/gu, "మరియు");
  repairedText = repairedText.replace(/మриయు/gu, "మరియు");
  repairedText = repairedText.replace(/మరిиయు/gu, "మరియు");
  repairedText = repairedText.replace(/వివేకిం/gu, "వివేకం");
  repairedText = repairedText.replace(/నియింతరణ/gu, "నియంత్రణ");

  repairedText = repairedText.replace(/(శీరిషిక|శీర్ิషక|సిర్శిక|శీర్షిక|శ్\s*ీ\s*ర్\s*ి\s*ష\s*క)/gu, "శీర్షిక");

  repairedText = repairedText.replace(/ర\s*్\s*ా/gu, "్రా");
