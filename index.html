<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v50.0</title>
<style>
  :root {
    --primary: #0f5132;
    --bg-light: #f8f9fa;
    --border-color: #dee2e6;
  }
  body {
    font-family: 'Mandali', 'Pothana', 'Segoe UI', sans-serif;
    margin: 0; padding: 0;
    background-color: #f1f3f5; color: #212529;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background-color: #0f5132; color: white;
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; }
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px; background-color: white; border-right: 1px solid var(--border-color);
    padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px;
  }
  .panel-section { background-color: var(--bg-light); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .action-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; }
  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }
  .btn-info { background-color: #0d6efd; }
  .btn-danger { background-color: #dc3545; }
  
  .main-editor { flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; gap: 15px; }
  .editor-block { display: flex; flex-direction: column; flex: 1; }
  textarea { width: 100%; flex: 1; padding: 16px; font-size: 16px; line-height: 1.7; border: 1px solid var(--border-color); border-radius: 8px; resize: none; }
  
  .premium-preview {
    width: 100%; flex: 1; background-color: #fffdf6; border: 1px solid var(--border-color); border-radius: 8px;
    padding: 35px; box-sizing: border-box; font-size: 19px; line-height: 2.0; white-space: pre-wrap; overflow-y: auto;
  }
  
  /* 🌟 అంతర్జాతీయ బుక్ ప్రచురణ లేఅవుట్ ప్రమాణాలు (36px & 26px Center Lock) */
  .main-chapter-style { font-size: 36px !important; font-weight: bold !important; color: #0f5132 !important; text-align: center !important; margin: 30px 0 15px 0 !important; display: block !important; line-height: 1.3 !important; }
  .book-heading-style { font-size: 26px !important; font-weight: bold !important; color: #198754 !important; text-align: center !important; margin: 20px 0 !important; display: block !important; line-height: 1.4 !important; }
  .sub-heading-style { font-size: 22px !important; font-weight: bold !important; color: #343a40 !important; margin: 15px 0 !important; display: block !important; }
  .book-paragraph { margin-bottom: 18px; text-align: justify; display: block; line-height: 1.8; }
  @media print {
    body * { visibility: hidden; }
    #cleanContainer, #cleanContainer * { visibility: visible; }
    #cleanContainer { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v50.0</h1>
</header>

<div class="workspace">
  <div class="sidebar">
    <div class="panel-section">
      <button class="action-btn btn-primary" onclick="processBookPublishing()">✨ లేఅవుట్ రన్ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-secondary" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-info" onclick="window.print()">🖨️ పీడీఎఫ్ / ప్రింట్ తీయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-danger" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>
    </div>
  </div>

  <div class="main-editor">
    <div class="editor-block">
      <textarea id="rough" oninput="saveDraft()" placeholder="మీ కొత్త పుస్తకం రఫ్ టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి... (ఏ అధ్యాయం అయినా సరే వాడుకోవచ్చు)"></textarea>
    </div>
    <div class="editor-block">
      <div id="cleanContainer" class="premium-preview">అంతర్జాతీయ పీడీఎఫ్ బుక్ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...</div>
    </div>
  </div>
</div>

<textarea id="clean" style="display:none;"></textarea>

<script>
function saveDraft() { localStorage.setItem("rough_draft", document.getElementById("rough").value); }
window.onload = function() {
  let saved = localStorage.getItem("rough_draft");
  if(saved) { document.getElementById("rough").value = saved; }
};

// 🌟 సార్వత్రిక తెలుగు యూనికోడ్ క్యారెక్టర్ రిపేర్ ఇంజన్ (ఏ కంటెంట్ కైనా ఒత్తులు, తప్పులు సెట్ చేస్తుంది)
function smartUnicodeRepair(text) {
  if (!text) return "";
  let repairedText = text.normalize("NFC");
  
  // 1. పాత తెలుగు అంకెలను అంతర్జాతీయ అంకెలుగా మార్చడం
  repairedText = repairedText.replace(/[\u0C66-\u0C6F]/g, function(ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
  });

  // 2. గ్లోబల్ హెడ్డింగ్ టైపోస్ క్లీనప్ (అధ్యాయాలు, శీర్షికల సాధారణ తప్పులు)
  repairedText = repairedText.replace(/(అధ్వయయిం|అధ్యాయం|అధ్యాయిం)/gu, "అధ్యాయం");
  repairedText = repairedText.replace(/(శీరిషిక|శీర్ిషక|సిర్శిక|శీర్షిక)/gu, "శీర్షిక");
  repairedText = repairedText.replace(/హెచ్చరిక\s*శీర్షిక/gu, "హెచ్చరిక శీర్షిక");
  repairedText = repairedText.replace(/హెచఛరిక\s*శీర్షిక/gu, "హెచ్చరిక శీర్షిక");

  // 3. సార్వత్రిక తెలుగు ఒత్తులు, గుణింతాల క్రమ అమరిక (Universal Rules)
  repairedText = repairedText.replace(/ర\s*్\s*ే/gu, "్రే"); 
  repairedText = repairedText.replace(/ర\s*్\s*్రా/gu, "放置"); 
  repairedText = repairedText.replace(/ర\s*్\s*్రా/gu, "్రా"); 
  repairedText = repairedText.replace(/ర\s*్\s*ా/gu, "్రా"); 
  repairedText = repairedText.replace(/ర\s*్\s*ి/gu, "్రి"); 
  repairedText = repairedText.replace(/త\s*ో\s*్/gu, "్తో"); 
  repairedText = repairedText.replace(/్\s*ో/gu, "ో"); 

  // 4. పాత మరియు కొత్త అధ్యాయాల సాధారణ ఒసిఆర్ తప్పుల శుద్ధి
  repairedText = repairedText.replace(/ముగషింపు/g, "ముగింపు");
  repairedText = repairedText.replace(/శాసనిం/g, "శాసనం");
  repairedText = repairedText.replace(/శూనయింలోని/g, "శూన్యంలోని");
  repairedText = repairedText.replace(/శూనయ/g, "శూన్య");
  repairedText = repairedText.replace(/వ్యтиర్ేక/g, "వ్యతిరేక");
  repairedText = repairedText.replace(/వ్యतिర్ేక/g, "వ్యతిరేక");
  repairedText = repairedText.replace(/వ్యతిర్ేక/g, "వ్యతిరేక");
  repairedText = repairedText.replace(/గురుత్వాకరిణ/g, "గురుత్వాకర్షణ");
  repairedText = repairedText.replace(/త్ో/g, "తో");
  repairedText = repairedText.replace(/పరయాణవనిి/g, "ప్రయాణాన్ని");
  repairedText = repairedText.replace(/పాయాణానిి/g, "ప్రయాణాన్ని");
  repairedText = repairedText.replace(/విశ్ా/g, "విశ్వ");
  repairedText = repairedText.replace(/ముగషించే/g, "ముగించే");
  repairedText = repairedText.replace(/ముగशించే/g, "ముగించే");
  repairedText = repairedText.replace(/పర్షణవమ/g, "పరిణామ");
  repairedText = repairedText.replace(/ధరమిం/g, "ధర్మం");
  repairedText = repairedText.replace(/ధరమ██నం/g, "ధర్మశాసనం");
  repairedText = repairedText.replace(/ధరమశ్వసనం/g, "ధర్మశాసనం");
  repairedText = repairedText.replace(/గందరగోళిం/g, "గందరగోళం");
  repairedText = repairedText.replace(/గందరగోళ్ం/g, "గందరగోళం");
  repairedText = repairedText.replace(/వెళ్లలప్్/g, "వెళ్లిపోయాక");
  repairedText = repairedText.replace(/వెళ్లులప్్/g, "వెళ్లిపోయాక");
  repairedText = repairedText.replace(/మారుు/g, "మార్పు");
  repairedText = repairedText.replace(/ఊహ ంచుకతందాం/g, "ఊహించుకుందాం");
  repairedText = repairedText.replace(/బిగ్ బ్యంగ్/g, "బిగ్ బ్యాంగ్");
  repairedText = repairedText.replace(/కీనెలం/g, "కేవలం");
  repairedText = repairedText.replace(/పరతీకతాల్రాలు/g, "ప్రతీకారాలు");
  repairedText = repairedText.replace(/మర్షయు/g, "మరియు");
  repairedText = repairedText.replace(/జంతు పరవృతుiల/g, "జంతు ప్రవృత్తుల");
  repairedText = repairedText.replace(/జంతు పరవృతుిల/g, "జంతు ప్రవృత్తుల");
  repairedText = repairedText.replace(/పోతేీమనిష్పన/g, "పోతే మనిషిని");
  repairedText = repairedText.replace(/పోతేమనిష్పన/g, "పోతే మనిషిని");
  repairedText = repairedText.replace(/ఉనికకేేత్యనసమాద్i/g, "ఉనికికే అత్యంత సమాధి");
  repairedText = repairedText.replace(/తవపతకునే/g, "తప్పుకునే");
  repairedText = repairedText.replace(/ఊండనే/g, "ఉందనే");
  repairedText = repairedText.replace(/తాతివక హ చిరిక/g, "తాత్విక హెచ్చరిక");
  repairedText = repairedText.replace(/కతళముందు/g, "కళ్లముందు");
  repairedText = repairedText.replace(/రైతనాయవంతము/g, "చైతన్యవంతము");
  repairedText = repairedText.replace(/స్టలకవని/g, "చిట్టచివరకు");
  repairedText = repairedText.replace(/మేధసుస/g, "మేధస్సు");
  repairedText = repairedText.replace(/ఎదుగుతునాi/g, "ఎదుగుతుందో");
  repairedText = repairedText.replace(/ఎదుగుతునాి/g, "ఎదుగుతుందో");
  repairedText = repairedText.replace(/रुiంకోవడానికి/g, "రుద్దడానికి");
  repairedText = repairedText.replace(/కవరోర్ేట లాభల కోసం/g, "కార్పొరేట్ లాభాల కోసం");
  repairedText = repairedText.replace(/మధ్యాయ/g, "మరియు");
  repairedText = repairedText.replace(/యుదాధ ల/g, "యుద్ధాల");
  repairedText = repairedText.replace(/వపడుకతంటోంది/g, "వాడుకుంటోంది");
  repairedText = repairedText.replace(/వివేకవనిi/g, "వివేకాన్ని");
  repairedText = repairedText.replace(/సంసకరణల/g, "సంస్కరణల");
  repairedText = repairedText.replace(/సవధనంగవ/g, "సాధనంగా");
  repairedText = repairedText.replace(/మారికపోే తే/g, "మార్చుకోకపోతే");
  repairedText = repairedText.replace(/ఉనాముదానిi/g, "ఉన్నదానిని");
  repairedText = repairedText.replace(/తవపవకతనేలా/g, "తప్పుకోలేనంతగా");
  repairedText = repairedText.replace(/స్పృత్కరిను/g, "స్పృशించబోయే");
  repairedText = repairedText.replace(/మీంగేయబోతుని/g, "మింగేయబోతున్న");
  repairedText = repairedText.replace(/మనిష్PFC/g, "మనిషి PFC");
  repairedText = repairedText.replace(/స్పష్టో/g, "స్పష్టమైన");
  repairedText = repairedText.replace(/లోంటిమానవ్/g, "లాంటి మానవ");
  repairedText = repairedText.replace(/అమిగడలాక్ో/g, "అమిగ్డలా క్రో");
  repairedText = repairedText.replace(/చవర్గతరక/g, "చర్చించబోయే");
  repairedText = repairedText.replace(/నిోల/g, "నిర్మూలించడానికి");
