<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>తెలుగు ఇంటెలిజెంట్ క్లీనర్ v96.5</title>
<style>
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f0f4f8; }
  .box { width: 100%; max-width: 850px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  h2 { text-align: center; color: #0f5132; margin-top: 0; font-size: 24px; }
  textarea { width: 100%; height: 200px; padding: 12px; font-size: 16px; border: 1px solid #bcccbe; border-radius: 6px; box-sizing: border-box; resize: vertical; }
  .output { background: #fffdf2; border: 1px solid #ffe69c; min-height: 200px; padding: 15px; font-size: 18px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; line-height: 1.8; color: #212529; }
  .btn-container { display: flex; gap: 10px; margin-top: 15px; }
  button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-clean { background: #0f5132; }
  .btn-clean:hover { background: #146c43; }
  .btn-copy { background: #0d6efd; }
  .btn-copy:hover { background: #0b5ed7; }
  .status { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="box">
  <h2>📚 సార్వత్రిక తెలుగు అక్షర క్లీనర్ v96.5 (అక్షరమాల ఇంజన్)</h2>
  <div id="statusBox" class="status"></div>
  <textarea id="in" placeholder="తప్పులున్న తెలుగు టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
  
  <div class="btn-container">
    <button id="cleanBtn" class="btn-clean" onclick="advancedTeluguClean()">✨ అన్ని తప్పులను సరిచేయి</button>
    <button class="btn-copy" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
  </div>
  
  <div id="out" class="output">సరిదిద్దబడిన స్పష్టమైన తెలుగు కంటెంట్ ఇక్కడ కనిపిస్తుంది...</div>
</div>

<script>
// 📝 సంపూర్ణ తెలుగు అక్షరమాల డేటాబేస్
const TELUGU_AKSHARAMALA = {
  achulu: ['అ', 'ఆ', 'ఇ', 'ఈ', 'ఉ', 'ఊ', 'ఋ', 'ౠ', 'ఎ', 'ఏ', 'ఐ', 'ఒ', 'ఓ', 'ఔ'],
  hallulu: ['క', 'ఖ', 'గ', 'ఘ', 'ఙ', 'చ', 'ఛ', 'జ', 'ఝ', 'ఞ', 'ట', 'ఠ', 'డ', 'ఢ', 'ణ', 'త', 'థ', 'ద', 'ధ', 'న', 'ప', 'ఫ', 'బ', 'భ', 'మ', 'య', 'ర', 'ల', 'వ', 'శ', 'ష', 'స', 'హ', 'ళ', 'క్ష', 'ఱ'],
  ubhayaksharalu: ['ం', 'ః', 'ఁ'],
  guninthాలు: ['ా', 'ి', 'ీ', 'ు', 'ూ', 'ృ', 'ౄ', 'ె', 'ే', 'ై', 'ొ', 'ో', 'ౌ', '్']
};

function advancedTeluguClean() {
  let text = document.getElementById("in").value;
  if (!text.trim()) {
    alert("దయచేసి టెక్స్ట్ బాక్స్‌లో కంటెంట్ పేస్ట్ చేయండి!");
    return;
  }

  let btn = document.getElementById("cleanBtn");
  let outputDiv = document.getElementById("out");
  let statusBox = document.getElementById("statusBox");
  
  btn.innerText = "⏳ అక్షరమాలను విశ్లేషిస్తోంది...";
  btn.disabled = true;
  statusBox.style.display = "block";
  statusBox.innerText = "🔍 అక్షరమాల ఇంజన్ ద్వారా ఒత్తులను సరిచేస్తోంది...";

  setTimeout(() => {
    // 1. యూనికోడ్ స్టాండర్డైజేషన్
    let cleanText = text.normalize("NFC");

    // 2. ఇతర భాషల స్క్రిప్ట్స్ తొలగింపు (హిందీ & రష్యన్)
    cleanText = cleanText.replace(/[\u0900-\u097F]/g, ""); 
    cleanText = cleanText.replace(/[\u0400-\u04FF]/g, ""); 

    // 3. అక్షరమాల లూప్ బేస్డ్ క్లీనప్ (డైనమిక్ ఒత్తుల అమరిక)
    // హల్లుల పక్కన స్పేస్ ఇచ్చి విడిపోయిన పొల్లులను ఒక దగ్గరకు చేరుస్తుంది
    TELUGU_AKSHARAMALA.hallulu.forEach(hallu => {
      let regexPollu = new RegExp(`${hallu}\\s+్`, 'g');
      cleanText = cleanText.replace(regexPollu, `${hallu}్`);
    });

    // 4. విడిపోయిన 'ర' వత్తుల కరెక్షన్ (ప్రా, ప్రి, ప్రో, మొదలైనవి)
    cleanText = cleanText.replace(/ర\s*్\s*ా/gu, "్రా");
    cleanText = cleanText.replace(/ర\s*్\s*ి/gu, "్రి");
    cleanText = cleanText.replace(/ర\s*్\s*ీ/gu, "్రీ");
    cleanText = cleanText.replace(/ర\s*్\s*ె/gu, "్రె");
    cleanText = cleanText.replace(/ర\s*్\s*ే/gu, "్రే");
    cleanText = cleanText.replace(/ర\s*్\s*ొ/gu, "్రొ");
    cleanText = cleanText.replace(/ర\s*్\s*ో/gu, "్రో");

    // 5. మిస్ ప్లేస్ అయిన గుణింత గుర్తుల కరెక్షన్
    cleanText = cleanText.replace(/్\s*ో/gu, "ో");
    cleanText = cleanText.replace(/్\s*ె/gu, "ె");
    cleanText = cleanText.replace(/్\s*ే/gu, "ే");
    cleanText = cleanText.replace(/్\s*ా/gu, "ా");
    cleanText = cleanText.replace(/త\s*ో\s*్/gu, "్తో");

    // 6. కామన్ ఏఐ/OCR పదాల ఆటో కరెక్షన్
    cleanText = cleanText.replace(/అధ్వయయిం/gu, "అధ్యాయం");
    cleanText = cleanText.replace(/అధ్యాయిం/gu, "అధ్యాయం");
    cleanText = cleanText.replace(/గొప/g, "గొప్ప");

    // అనవసరమైన డబుల్ స్పేస్‌ల క్లీనప్
    cleanText = cleanText.replace(/\s+/g, " ");

    // అవుట్‌పుట్ చూపించడం
    outputDiv.innerText = cleanText.trim();
    statusBox.innerText = "✨ అక్షరమాల ఇంజన్ క్లీనప్ విజయవంతంగా పూర్తయింది!";
    btn.innerText = "✨ అన్ని తప్పులను సరిచేయి";
    btn.disabled = false;
  }, 400); 
}

function copyText() {
  let text = document.getElementById("out").innerText;
  if(text.startsWith("సరిదిద్దబడిన")) return;
  
  navigator.clipboard.writeText(text).then(() => {
    alert("📋 కంటెంట్ విజయవంతంగా కాపీ అయింది!");
  }).catch(err => {
    alert("కాపీ కుదరలేదు, దయచేసి మాన్యువల్‌గా కాపీ చేసుకోండి.");
  });
}
</script>

</body>
</html>
