<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v32.0</title>
<style>
  :root {
    --primary: #0f5132;
    --bg-light: #f8f9fa;
    --border-color: #dee2e6;
  }
  body {
    font-family: 'Mandali', 'Pothana', 'Segoe UI', sans-serif;
    margin: 0; padding: 0;
    background-color: #f1f3f5; color: #212529;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background-color: #0f5132; color: white;
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; }
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px; background-color: white; border-right: 1px solid var(--border-color);
    padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px;
  }
  .panel-section { background-color: var(--bg-light); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
  .action-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; color: white; }
  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }
  .btn-info { background-color: #0d6efd; }
  .btn-danger { background-color: #dc3545; }
  
  .main-editor { flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; gap: 15px; }
  .editor-block { display: flex; flex-direction: column; flex: 1; }
  textarea { width: 100%; flex: 1; padding: 16px; font-size: 16px; line-height: 1.7; border: 1px solid var(--border-color); border-radius: 8px; resize: none; }
  
  .premium-preview {
    width: 100%; flex: 1; background-color: #fffdf6; border: 1px solid var(--border-color); border-radius: 8px;
    padding: 35px; box-sizing: border-box; font-size: 19px; line-height: 2.0; white-space: pre-wrap; overflow-y: auto;
  }
  
  /* 🌟 ఇంటర్నేషనల్ బుక్ లేఅవుట్ ప్రమాణాలు */
  .main-chapter-style { font-size: 36px !important; font-weight: bold !important; color: #0f5132 !important; text-align: center !important; margin: 30px 0 15px 0 !important; display: block !important; line-height: 1.3 !important; }
  .book-heading-style { font-size: 26px !important; font-weight: bold !important; color: #198754 !important; text-align: center !important; margin: 15px 0 25px 0 !important; display: block !important; line-height: 1.4 !important; }
  .sub-heading-style { font-size: 22px !important; font-weight: bold !important; color: #343a40 !important; margin: 15px 0 10px 0 !important; display: block !important; }
  .book-paragraph { margin-bottom: 18px; text-align: justify; display: block; line-height: 1.8; }
  @media print {
    body * { visibility: hidden; }
    #cleanContainer, #cleanContainer * { visibility: visible; }
    #cleanContainer { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v32.0</h1>
</header>

<div class="workspace">
  <div class="sidebar">
    <div class="panel-section">
      <button class="action-btn btn-primary" onclick="processBookPublishing()">✨ లేఅవుట్ రన్ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-secondary" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-info" onclick="window.print()">🖨️ పీడీఎఫ్ / ప్రింట్ తీయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-danger" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>
    </div>
  </div>

  <div class="main-editor">
    <div class="editor-block">
      <textarea id="rough" oninput="saveDraft()" placeholder="మీ పుస్తకం రఫ్ టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
    </div>
    <div class="editor-block">
      <div id="cleanContainer" class="premium-preview">అంతర్జాతీయ పీడీఎఫ్ బుక్ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...</div>
    </div>
  </div>
</div>

<textarea id="clean" style="display:none;"></textarea>

<script>
function saveDraft() { localStorage.setItem("rough_draft", document.getElementById("rough").value); }
window.onload = function() {
  let saved = localStorage.getItem("rough_draft");
  if(saved) { document.getElementById("rough").value = saved; }
};

function smartUnicodeRepair(text) {
  if (!text) return "";
  text = text.replace(/⚠️\[సరిచూసుకోండి\]/g, "");
  text = text.normalize("NFC");
  
  // 1. హిందీ/దేవనాగరి అక్షరాల క్లీనప్
  text = text.replace(/व्यтиర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/व्यतिర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/వ్యтиర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/వ్యతిర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/గురుతావ[^\u0C00-\u0C7F]*करషణ/gu, "గురుత్వాకర్షణ");
  text = text.replace(/[\u0900-\u097F]/gu, ""); 

  // 2. తెలుగు ఒత్తుల బైట్ రిపేర్
  text = text.replace(/ర\s*్\s*ే/gu, "్రే"); 
  text = text.replace(/ర\s*్\s*్రా/gu, "్రా"); 
  text = text.replace(/ర\s*్\s*ా/gu, "్రా"); 
  text = text.replace(/ర\s*్\s*ి/gu, "్రి"); 
  text = text.replace(/త\s*ో\s*్/gu, "్తో"); 
  text = text.replace(/్\s*ో/gu, "ో"); 

  // 3. తప్పుల సంపూర్ణ సవరణల నిఘంటువు
  text = text.replace(/హెచ్చరిక\s*శీర్షిక/gu, "హెచ్చరిక శీర్షిక");
  text = text.replace(/అధ్వయయిం/gu, "అధ్యాయం");
  text = text.replace(/అధ్యాయం/gu, "అధ్యాయం");
  text = text.replace(/శీరిషిక/gu, "శీర్షిక");
  text = text.replace(/ముగషింపు/gu, "ముగింపు");
  text = text.replace(/శాసనిం/gu, "శాసనం");
  text = text.replace(/శూనయింలోని/gu, "శూన్యంలోని");
  text = text.replace(/వ్యతిర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/గురుత్వాకరిణ/gu, "గురుత్వాకర్షణ");
  text = text.replace(/త్ో/gu, "తో");
  text = text.replace(/పరయాణవనిి/gu, "ప్రయాణాన్ని");
  text = text.replace(/పాయాణానిి/gu, "ప్రయాణాన్ని");
  text = text.replace(/విశ్ా/gu, "విశ్వ");
  text = text.replace(/ముగషించే/gu, "ముగించే");
  text = text.replace(/పర్షణవమ/gu, "పరిణామ");
  text = text.replace(/ధరమిం/gu, "ధర్మం");
  text = text.replace(/ధరమశ్వసనం/gu, "ధర్మశాసనం");
  text = text.replace(/గందరగోళిం/gu, "గందరగోళం");
  text = text.replace(/గందరగోళ్ం/gu, "గందరగోళం");
  text = text.replace(/వెళ్లలప్్/gu, "వెళ్లిపోయాక");
  text = text.replace(/మారుు/gu, "మార్పు");
  text = text.replace(/ఊహ\s+ంచుకతందాం/gu, "ఊహించుకుందాం");
  text = text.replace(/బిగ్\s+బ్యంగ్/gu, "బిగ్ బ్యాంగ్");

  // అధ్యాయం 33.4 & 34 కొత్త దోషాల శుద్ధి
  text = text.replace(/కీనెలం/gu, "కేవలం");
  text = text.replace(/పరతీకతాల్రాలు/gu, "ప్రతీకారాలు");
  text = text.replace(/మర్షయు/gu, "మриయు");
  text = text.replace(/మర్షయు/gu, "మరియు");
  text = text.replace(/జంతు పరవృతుిల/gu, "జంతు ప్రవృత్తుల");
  text = text.replace(/వాడుకలింటాయి/gu, "వాడుకుంటాయి");
  text = text.replace(/పోతేీమనిష్పన/gu, "పోతే మనిషిని");
  text = text.replace(/ఉనికకేేత్యనసമാద్ి/gu, "ఉనికికే అత్యంత సమాధి");
  text = text.replace(/తవపతకునే/gu, "తప్పుకునే");
  text = text.replace(/ఊండనే/gu, "ఉందనే");
  text = text.replace(/తాతివక హ చిరిక/gu, "తాత్విక హెచ్చరిక");
  text = text.replace(/కతళముందు/gu, "కళ్లముందు");
  text = text.replace(/రైతనాయవంతము/gu, "చైతన్యవంతము");
  text = text.replace(/స్టలకవని/gu, "చిట్టచివరకు");
  text = text.replace(/మేధసుస/gu, "మేధస్సు");
  text = text.replace(/ఎదుగుతునాి/gu, "ఎదుగుతుందో");
  text = text.replace(/కవరోర్ేట లాభల కోసం/gu, "కార్పొరేట్ లాభాల కోసం");
  text = text.replace(/మధ్యాయ/gu, "మరియు");
  text = text.replace(/యుదాధ ల/gu, "యుద్ధాల");
  text = text.replace(/వపడుకతంటోంది/gu, "వాడుకుంటోంది");
  text = text.replace(/వివేకవనిి/gu, "వివేకాన్ని");
  text = text.replace(/సంసకరణల/gu, "సంస్కరణల");
  text = text.replace(/సవధనంగవ/gu, "సాధనంగా");
  text = text.replace(/మారికపోే తే/gu, "మార్చుకోకపోతే");
  text = text.replace(/ఉనాముదానిి/gu, "ఉన్నదానిని");
  text = text.replace(/తవపవకతనేలా/gu, "తప్పుకోలేనంతగా");
  text = text.replace(/స్పృత్కరిను/gu, "స్పృశించబోయే");
  text = text.replace(/మీంగేయబోతుని/gu, "మింగేయబోతున్న");
  text = text.replace(/ఆదిమ\s*ా\s*ి/gu, "ఆదిమ");
  text = text.replace(/కోటుఎకుకోేతతిం/gu, "కోల్పోతామనే");
  text = text.replace(/శ్\s*్\s*కిత/gu, "శక్తి");
  text = text.replace(/మనిష్PFC/gu, "మనిషి PFC");
  text = text.replace(/స్పష్ట\s*ో/gu, "స్పష్టమైన");
  text = text.replace(/మశ్పిమగం/gu, "ముఖ్యంగా");
  text = text.replace(/లోంటిమానవ్/gu, "లాంటి మానవ");
  text = text.replace(/అమిగడలాక్ో/gu, "అమిగ్డలా క్రో");
  text = text.replace(/చవర్గతరక/gu, "చర్చించబోయే");
  text = text.replace(/నిर्ోల/gu, "నిర్మూలించడానికి");
  text = text.replace(/विదుయత్/gu, "విద్యుత్");
  text = text.replace(/రూపాయంతరం/gu, "రూపాంతరం");
  text = text.replace(/చతందాం/gu, "చూద్దాం");
  text = text.replace(/చిట్టచవరకు/gu, "చిట్టచివరకు");
  text = text.replace(/సంచలనమ/gu, "సంచలనమైన");
  text = text.replace(/పాప్\s*డం\s*ే\s*ప్\s*్\s*స్పుడు/gu, "ప్రారంభించినప్పుడు");
  text = text.replace(/వైజఞా\s*నిక\s*చ/gu, "వైజ్ఞానిక చైతన్య");
  text = text.replace(/చాாిత్రక/gu, "చారిత్రక");
  text = text.replace(/సజీవంగా/gu, "సజీవంగా");
  text = text.replace(/ఆవేశ్\s*కందామ\s*్\s*ైన/gu, "ఆవేశపూరితమైన");
  text = text.replace(/మళ్ీ/gu, "మళ్లీ");
  text = text.replace(/అపుగిను/gu, "అдуపును");
  text = text.replace(/నోడు/gu, "చూడు");
  text = text.replace(/సృష్పకరును/gu, "సృష్టికర్తను");
  text = text.replace(/రవక్షసుడు/gu, "రాక్షసుడు");
  text = text.replace(/మీంగేయబో\s*తుని/gu, "మింగేయబోతున్న");
  text = text.replace(/చని\s*నితయజీవిత/gu, "చిన్న నిత్యజీవిత");
  text = text.replace(/రవత్ోంబగళ్శ/gu, "రాత్రింబగళ్లు");
  text = text.replace(/శీ౹మించన/gu, "श్రమించిన");
  text = text.replace(/స్మీనాయనికి/gu, "సైన్యానికి");
  text = text.replace(/పొదాన/gu, "ప్రధాన");
  text = text.replace(/కంటోోల్/gu, "కంట్రోల్");
  text = text.replace(/కంటోో\s*ల్/gu, "కంట్రోల్");
  text = text.replace(/కరడుగటిన/gu, "కరడుగట్టిన");
  text = text.replace(/కరూరమ\s*్\s*ైన/gu, "క్రూరమైన");
  text = text.replace(/వీధి\s*రలేడి/gu, "వీధి రౌడీల");
  text = text.replace(/పేటేీశ్వరు/gu, "పెట్టేసారు");
  text = text.replace(/విలతవ/gu, "విలువ");
