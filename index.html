<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>తెలుగు బుక్ పబ్లిషింగ్ లేఅవుట్ ఇంజన్ v16.0</title>
<style>
  :root {
    --primary: #0f5132;
    --primary-hover: #146c43;
    --bg-light: #f8f9fa;
    --border-color: #dee2e6;
  }
  body {
    font-family: 'Mandali', 'Pothana', 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f1f3f5;
    color: #212529;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background-color: var(--primary);
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; }
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px;
    background-color: white;
    border-right: 1px solid var(--border-color);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .panel-section {
    background-color: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
  }
  .action-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    color: white;
  }
  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }
  .btn-info { background-color: #0d6efd; }
  .btn-danger { background-color: #dc3545; }
  
  .main-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
    gap: 15px;
  }
  .editor-block { display: flex; flex-direction: column; flex: 1; }
  textarea {
    width: 100%;
    flex: 1;
    padding: 16px;
    font-size: 16px;
    line-height: 1.7;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    resize: none;
  }
  
  .premium-preview {
    width: 100%;
    flex: 1;
    background-color: #fffdf6;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 35px;
    box-sizing: border-box;
    font-size: 19px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-y: auto;
  }
  
  /* MS Word ప్రొటెక్షన్: ప్రింటింగ్ మరియు కాపీ కోసం పక్కా సైజ్ రూల్స్ */
  .main-chapter-style {
    font-size: 36px !important;
    font-weight: bold !important;
    color: var(--primary) !important;
    text-align: center !important;
    margin: 20px 0 !important;
    display: block !important;
  }
  .book-heading-style {
    font-size: 26px !important;
    font-weight: bold !important;
    color: #198754 !important;
    text-align: center !important;
    margin: 15px 0 !important;
    display: block !important;
  }
  .sub-heading-style {
    font-size: 20px !important;
    font-weight: bold !important;
    color: #343a40 !important;
    margin: 12px 0 !important;
    display: block !important;
  }
  .book-paragraph {
    margin-bottom: 12px;
    text-align: justify;
    display: block;
  }
  @media print {
    body * { visibility: hidden; }
    #cleanContainer, #cleanContainer * { visibility: visible; }
    #cleanContainer { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>📚 తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v16.0</h1>
</header>

<div class="workspace">
  <div class="sidebar">
    <div class="panel-section">
      <button class="action-btn btn-primary" onclick="processBookPublishing()">✨ లేఅవుట్ రన్ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-secondary" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-info" onclick="window.print()">🖨️ పీడీఎఫ్ / ప్రింట్ తీయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-danger" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>
    </div>
  </div>

  <div class="main-editor">
    <div class="editor-block">
      <textarea id="rough" oninput="saveDraft()" placeholder="మీ పుస్తకం టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
    </div>
    <div class="editor-block">
      <div id="cleanContainer" class="premium-preview">అంతర్జాతీయ పీడీఎఫ్ బుక్ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...</div>
    </div>
  </div>
</div>

<textarea id="clean" style="display:none;"></textarea>

<script>
function saveDraft() { localStorage.setItem("rough_draft", document.getElementById("rough").value); }
window.onload = function() {
  let saved = localStorage.getItem("rough_draft");
  if(saved) { document.getElementById("rough").value = saved; }
};

// 🌟 హిందీ/దేవనాగరి అక్షరాలను ముక్కలతో సహా పూర్తిగా తుడిచేసే మాస్టర్ ఇంజన్
function cleanForeignCharacters(text) {
  if (!text) return "";

  text = text.replace(/⚠️\[సరిచూసుకోండి\]/g, "");

  // టెక్స్ట్‌లో అతుక్కుపోయిన ముద్ద పదాలను విడదీయడం
  text = text.replace(/పరయాణవниిసూపర్/gu, "ప్రయాణాన్ని సూపర్");
  text = text.replace(/పరయాణవనిిసూపర్/gu, "ప్రయాణాన్ని సూపర్");
  text = text.replace(/వ్యтиర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/వ్యतिర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/గురుతావकरషణ/gu, "గురుత్వాకర్షణ");

  // దేవనాగరి/हिन्दी క్యారెక్టర్ రేంజ్ (\u0900-\u097F) ఎక్కడున్నా దాన్ని పూర్తిగా డిలీట్ చేస్తుంది
  text = text.replace(/[\u0900-\u097F]/gu, "");

  // పాత కామన్ టైపోస్ రిపేర్
  text = text.replace(/ముగషింపు/gu, "ముగింపు");
  text = text.replace(/శాసనిం/gu, "శాసనం");
  text = text.replace(/శూనయింలోని/gu, "శూన్యంలోని");
  text = text.replace(/వ్యтиర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/వ్యతిర్ేక/gu, "వ్యతిరేక");
  text = text.replace(/అధ్వయయిం/gu, "అధ్యాయం");
  text = text.replace(/అధ్యాయం/gu, "అధ్యాయం");
  text = text.replace(/శీర్షిక/gu, "శీర్షిక");
  text = text.replace(/గురుత్వాకరిణ/gu, "గురుత్వాకర్షణ");
  text = text.replace(/త్ో/gu, "తో");
  text = text.replace(/పరయాణవనిి/gu, "ప్రయాణాన్ని");
  text = text.replace(/పాయాణానిి/gu, "ప్రయాణాన్ని");
  text = text.replace(/విశ్ా/gu, "విశ్వ");
  text = text.replace(/ముగషించే/gu, "ముగించే");
  text = text.replace(/పర్షణవమ/gu, "పరిణామ");
  text = text.replace(/ధరమిం/gu, "ధర్మం");
  text = text.replace(/ధరమశ్వసనం/gu, "ధర్మశాసనం");
  text = text.replace(/గందరగోళిం/gu, "గందరగోళం");
  text = text.replace(/గందరగోళ్ం/gu, "గందరగోళం");
  text = text.replace(/వెళ్లలప్్/gu, "వెళ్లిపోయాక");
  text = text.replace(/మారుు/gu, "మార్పు");
  text = text.replace(/ఊహ\s+ంచుకతందాం/gu, "ఊహించుకుందాం");
  text = text.replace(/ఉహ\s+ంచుకతందాం/gu, "ఊహించుకుందాం");
  text = text.replace(/బిగ్\s+బ్యంగ్/gu, "బిగ్ బ్యాంగ్");

  // తెలుగు అంకెలను అంతర్జాతీయ అంకెలుగా మార్చడం
  text = text.replace(/[\u0C66-\u0C6F]/gu, function(ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
  });

  return text;
}

function processBookPublishing() {
  let rawInput = document.getElementById("rough").value;
  if (!rawInput) return;

  // రన్ హిందీ క్లీనర్
  let cleanedText = cleanForeignCharacters(rawInput);

  let lines = cleanedText.split("\n");
  let htmlOutput = [];
  let rawTextOutput = [];

  for (let line of lines) {
    let trimmedLine = line.trim();
    if (!trimmedLine) {
      htmlOutput.push("<br>");
      rawTextOutput.push("");
      continue;
    }

    // శీర్షికల గుర్తింపు
    let isMainChapter = /^(అధ్యాయం|అధ్వయయిం|Chapter)/i.test(trimmedLine);
    let isBookHeading = /^(శీర్షిక|శీరిషిక|Title)/i.test(trimmedLine);
    let isSubHeading = /^(ఉప శీర్షిక|ఉపశీర్షిక|సూపర్ ఏఐ|అంతిమ|ఆమ|Sub|Section)/i.test(trimmedLine);

    // 🌟 వర్డ్ డాక్యుమెంట్ ప్రొటెక్షన్: ఎక్స్‌ట్రా గ్యాప్స్ రాకుండా స్పేసెస్‌ను నీట్‌గా ఒకే లైన్ లోకి సర్దడం
    let cleanLine = trimmedLine.replace(/[ \t]+/g, " ");
    rawTextOutput.push(cleanLine);

    if (isMainChapter) {
      htmlOutput.push("<span class='main-chapter-style'>" + cleanLine + "</span>");
    } else if (isBookHeading) {
      htmlOutput.push("<span class='book-heading-style'>" + cleanLine + "</span>");
    } else if (isSubHeading) {
      htmlOutput.push("<span class='sub-heading-style'>" + cleanLine + "</span>");
    } else {
      htmlOutput.push("<div class='book-paragraph'>" + cleanLine + "</div>");
    }
  }

  document.getElementById("cleanContainer").innerHTML = htmlOutput.join("");
  document.getElementById("clean").value = rawTextOutput.join("\n");
}

async function copyText() {
  const output = document.getElementById("clean");
  if (!output.value) return;
  await navigator.clipboard.writeText(output.value);
  alert("టెక్స్ట్ విజయవంతంగా కాపీ అయింది! ఇప్పుడు మీరు వర్డ్ లో పేస్ట్ చేసుకోవచ్చు.");
}

function clearText() {
  document.getElementById("rough").value = "";
  document.getElementById("cleanContainer").innerHTML = "పీడీఎఫ్ తరహా అంతర్జాతీయ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...";
  document.getElementById("clean").value = "";
  localStorage.removeItem("rough_draft");
}
</script>
</body>
</html>
