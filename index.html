<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>తెలుగు బుక్ పబ్లిషింగ్ లేఅవుట్ ఫిల్టర్</title>
<style>

  font-family: 'Mandali', 'Pothana', sans-serif;

  color: #333;
}

  color: #0d5c3a;
  border-bottom: 3px solid #0d5c3a;
  padding-bottom: 10px;
}
textarea {
  width: 100%;
  height: 250px;
  box-sizing: border-box;
  padding: 15px;
  font-size: 16px;
  margin: 10px 0;
  border: 2px solid #bdc3c7;
  border-radius: 6px;
}
button {
  padding: 12px 25px;
  margin: 5px 4px;
  font-size: 15px;
  cursor: pointer;
  background-color: #0d5c3a;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
}
button:hover {
  background-color: #09442a;
}
.clear-btn {
  background-color: #c0392b;
}
.clear-btn:hover {
  background-color: #962d22;
}
.info-box {
  background-color: #e8f5e9;
  padding: 12px 20px;
  border-left: 5px solid #0d5c3a;

/* అంతర్జాతీయ పబ్లిషింగ్ రూల్: చాప్టర్లు & నంబర్లకు పెద్ద ఫాంట్ సైజ్ */
.book-heading {
  font-size: 26px;
  font-weight: bold;
  color: #0d5c3a;
  margin-top: 20px;
  margin-bottom: 15px;
  display: block;
  border-bottom: 2px solid #0d5c3a;
  padding-bottom: 8px;

</head>
<body>

<h2>📚 తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ఫిల్టర్</h2>

<div class="info-box">
  <strong>సక్రియ నియమాలు:</strong> ఒత్తులు మార్చకుండా ఆటో-కరెక్షన్ | శీర్షికలకు పెద్ద అంతర్జాతీయ ఫాంట్ సైజ్ (26px) | మధ్యలో వచ్చే ఇంగ్లీష్ పదాలకు బ్రాకెట్లు | కేవలం 123 అంకెలు.
</div>

<label><strong>రచయిత రఫ్ టెక్స్ట్ (Rough Manuscript):</strong></label>
<textarea id="rough" placeholder="మీ పుస్తకం టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>

<button onclick="processBookPublishing()">బుక్ లేఅవుట్ క్లీన్ చేయి</button>
<button onclick="copyText()">క్లీన్ టెక్స్ట్ కాపీ చేయి</button>
<button class="clear-btn" onclick="clearText()">క్లియర్</button>

<label><strong>పబ్లిషింగ్ రెడీ ప్యూర్ లేఅవుట్ వ్యూ (Ready for Print):</strong></label>
<div id="cleanContainer" class="output-preview">సరిదిద్దబడిన ప్యూర్ టెక్స్ట్ అంతర్జాతీయ లేఅవుట్ ఫాంట్‌తో ఇక్కడ కనిపిస్తుంది...</div>
<textarea id="clean" style="display:none;"></textarea>

<script>
// ఒత్తులు చెడిపోకుండా కేవలం పక్కా పదాలను మాత్రమే మార్చే మాస్టర్ డిక్షనరీ
const masterSpellCheck = {
  "ముగషింపు": "ముగింపు", "ముగషించే": "ముగించే", "వ్యతిర్ేక": "వ్యతిరేక",
  "పరయాణవనిి": "ప్రయాణాన్ని", "పాయాణానిి": "ప్రయాణాన్ని", "ధరమిం": "ధర్మం",
  "విశ్ా": "విశ్వ", "పర్షణవమ": "పరిణామ", "శాసనిం": "శాసనం", "శ్వసనం": "శాసనం",
  "కవంతి": "కాంతి", "వేగంగవ": "వేగంగా", "నెటేిస్టన": "నెట్టేసిన", "ర్షవ్ర్్": "రివర్స్",
  "శ్క్ిత": "శక్తి", "ప్్వారంభంచందో": "ప్రారంభించిందో", "ఇపపుడు": "ఇప్పుడు",
  "యొकక": "యొక్క", "యొกก": "యొక్క", "యొక్క": "యొక్క", "యొकक": "యొక్క",
  "క్రూరతావనిి": "క్రూరత్వాన్ని", "అశ్వంతిని": "అశాంతిని", "స్టదధమవపతోంది": "సిద్ధమవుతోంది",
  "ఘరషణ": "ఘర్షణ", "సంవతసరవల": "సంవత్సరాల", "సంవతసరవలతగవ": "సంవత్సరాలుగా",
  "తరవవత": "తర్వాత", "మేధసుసగవ": "మేధస్సుగా", "పాశ్వంత": "ప్రశాంత", "పాశ్వంతంగవ": "ప్రశాంతంగా",
  "స్టథతి": "స్థితి", "వెైపప": "వైపు", "అడుగులత": "అడుగులు", "వేస్ు": "వేస్తోంది",
  "గందరగోళ్ం": "గందరగోళం", "శ్బ్ద": "శబ్దాలు", "బంధువపల": "బంధువుల", "బంధువపలంతా": "బంధువులంతా",
  "అరుపపలత": "అరుపులతో", "పటలలల": "పిల్లల", "అలలరితో": "అల్లరితో", "ఉంట": "ఉంటుంది",
  "కవనీ": "కానీ", "రవతిా": "రాత్రి", "అయ్యయసరికి": "అయ్యేసరికి", "ముగిస్ట": "ముగిసి",
  "వెళ్లలప్్": "వెళ్లిపోయాక", "ఒकకసవరిగవ": "ఒక్కసారిగా", "అتయంత": "అత్యంత",
  "నిశ్శబదంగవ": "నిశ్శబ్దంగా", "నిశ్శబ్దిం": "నిశ్శబ్దం", "మారుు": "మార్పు",
  "సరిగవా": "సరిగ్గా", "భూమిపెై": "భూమిపై", "జంతువపల": "జంతువుల", "యుదాధ": "యుద్ధాలు",
  "చట్ి": "చెట్ల", "ఉరితాళ్లల": "ఉరితాళ్లు", "ఆవిరవావంతో": "ఆవిర్భావంతో",
  "పావృతుు": "ప్రవృత్తుల", "అంతమ": "అంతమై", "పరిపూరణమ": "పరిపూర్ణమైన",
  "వెైజఞా": "వైజ్ఞానిక", "చేరుకతంట": "చేరుకుంటుంది", "గురుతావकरషణ": "గురుత్వాకర్షణ",
  "అప్వరమ": "అపారమైన", "సవరవతిాక": "సార్వత్రిక", "పరామతో": "ప్రేమతో",
  "తీరుు": "తీర్పు", "రచయ్తగవ": "రచయితగా", "సమాజఞనికి": "సమాజానికి",
  "అధ్వయయిం": "అధ్యాయం", "పర్షమితులు": "పరిమితులు", "మర్షయు": "మరియు",
  "అలాార్షథమిక్": "అల్గారిథమిక్", "గురుత్వాకరిణ": "గురుత్వాకర్షణ"
};

function processBookPublishing() {
  let text = document.getElementById("rough").value;
  if (!text) return;

  // కామన్ మిస్టేక్స్ ని ముందుగా క్లీన్ చేయడం
  text = text.replace(/⚠️\[సరిచూసుకోండి\]/g, "");
  text = text.replace(/డ\s+ジ\s+న\s+ల్స/g, "డిజిటల్");
  text = text.replace(/డ\s+జిటల్స/g, "డిజిటల్");

  let lines = text.split("\n");
  let htmlOutput = [];
  let rawTextOutput = [];

  for (let line of lines) {
    if (!line.trim()) {
      htmlOutput.push("<br>");
      rawTextOutput.push("");
      continue;
    }

    // అంతర్జాతీయ పబ్లిషింగ్ రూల్: శీర్షిక లేదా అధ్యాయం లైన్ గుర్తింపు
    let isHeading = /^(శీర్షిక|అధ్యాయం|అధ్వయయిం|Title|Chapter)/i.test(line.trim());

    let words = line.split(/\s+/);
    let processedWords = [];

    for (let i = 0; i < words.length; i++) {
      let word = words[i];
      if (!word) continue;

      // 1. కేవలం 123 అంకెలను మాత్రమే ఉంచడం, పాత తెలుగు అంకెలను ఇంటర్నేషనల్ గా మార్చడం
      word = word.replace(/[\u0C66-\u0C6F]/gu, function(ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
      });

      // 2. వింత గుర్తులను తీసేయడం, ప్రాథమిక గుర్తులు (.,!?()) మాత్రమే ఉంచడం
      word = word.replace(/[^\u0C00-\u0C7Fa-zA-Z0-9.,!?()]/gu, "");
      if (!word) continue;

      // విరామ చిహ్నాలు వేరు చేయడం
      let cleanWord = word.replace(/[.,!?()]/g, "");
      let punctuationBefore = word.match(/^[(]*/) ? word.match(/^[(]*/) : "";
      let punctuationAfter = word.match(/[.,!?)]*$/) ? word.match(/[.,!?)]*$/) : "";

      // 3. డిక్షనరీ సవరణ
      if (masterSpellCheck[cleanWord]) {
        cleanWord = masterSpellCheck[cleanWord];
      }

      // 4. ఇంగ్లీష్ పదాల బ్రాకెట్ రూల్
      let isEnglish = /^[a-zA-Z0-9]+$/.test(cleanWord);
      if (isEnglish) {
        if (i === 0 || isHeading) {
          word = punctuationBefore + cleanWord + punctuationAfter;
        } else {
          word = punctuationBefore + "(" + cleanWord + ")" + punctuationAfter;
        }
      } else {
        word = punctuationBefore + cleanWord + punctuationAfter;
      }

      processedWords.push(word);
    }

    let cleanLine = processedWords.join(" ");
    
    // స్పేసింగ్ సర్దుబాటు
    cleanLine = cleanLine.replace(/\s+([.,!?}])/g, "$1");
    cleanLine = cleanLine.replace(/([({])\s+/g, "$1");
    cleanLine = cleanLine.replace(/([.,!?])(?=[^\s])/g, "$1 ");
    
    let finalLine = cleanLine.trim();
    rawTextOutput.push(finalLine);

    if (isHeading) {
      htmlOutput.push("<span class='book-heading'>" + finalLine + "</span>");
    } else {
      htmlOutput.push("<div>" + finalLine + "</div>");
    }
  }

  document.getElementById("cleanContainer").innerHTML = htmlOutput.join("");
  document.getElementById("clean").value = rawTextOutput.join("\n");
}

async function copyText() {
  const output = document.getElementById("clean");
  if (!output.value) {
    alert("ముందుగా క్లీన్ బటన్ నొక్కండి.");
    return;
  }
  try {
    await navigator.clipboard.writeText(output.value);
    alert("పబ్లిషింగ్ రెడీ ప్యూర్ టెక్స్ట్ కాపీ అయింది!");
  } catch (e) {
    alert("మన్యువల్‌గా Copy చేసుకోండి.");
  }
}

function clearText() {
  document.getElementById("rough").value = "";
  document.getElementById("cleanContainer").innerHTML = "సరిదిద్దబడిన ప్యూర్ టెక్స్ట్ అంతర్జాతీయ లేఅవుట్ ఫాంట్‌తో ఇక్కడ కనిపిస్తుంది...";
  document.getElementById("clean").value = "";
}
</script>

</body>
</html>
