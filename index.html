<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>తెలుగు ఇంటెలిజెంట్ క్లీనర్ v98.0</title>
<style>
  body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; }
  .box { width: 100%; max-width: 850px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  h2 { text-align: center; color: #0f5132; margin-top: 0; font-size: 24px; }
  textarea { width: 100%; height: 200px; padding: 12px; font-size: 16px; border: 1px solid #bcccbe; border-radius: 6px; box-sizing: border-box; resize: vertical; }
  .output { background: #fffdf2; border: 1px solid #ffe69c; min-height: 200px; padding: 15px; font-size: 18px; border-radius: 6px; white-space: pre-wrap; margin-top: 15px; line-height: 1.8; color: #212529; }
  .btn-container { display: flex; gap: 10px; margin-top: 15px; }
  button { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-clean { background: #0f5132; }
  .btn-clean:hover { background: #146c43; }
  .btn-copy { background: #0d6efd; }
  .btn-copy:hover { background: #0b5ed7; }
  .status { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="box">
  <h2>📚 సార్వత్రిక తెలుగు అక్షర క్లీనర్ v98.0 (మల్టీ-లాంగ్వేజ్ కన్వర్టర్)</h2>
  <div id="statusBox" class="status"></div>
  <textarea id="in" placeholder="తప్పులున్న తెలుగు టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
  
  <div class="btn-container">
    <button id="cleanBtn" class="btn-clean" onclick="advancedTeluguClean()">✨ అన్ని తప్పులను సరిచేయి</button>
    <button class="btn-copy" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
  </div>
  
  <div id="out" class="output">సриదిద్దబడిన స్పష్టమైన తెలుగు కంటెంట్ ఇక్కడ కనిపిస్తుంది...</div>
</div>

<script>
// అన్యభాషా పదాలను తెలుగులోకి మార్చే స్మార్ట్ డిక్షనరీ / నిఘంటువు
const LANGUAGE_TRANSLITERATOR = {
  "привет": "ప్రియవెట్ (హలో)",
  "भारत": "భారత్",
  "देश": "దేశ్",
  "भारत देश": "భారతదేశం"
};

// ఆన్‌లైన్ ద్వారా అపరిచిత విదేశీ పదాలను తెలుగు లిపిలోకి మార్చే ఫంక్షన్
async function translateForeignToTelugu(text) {
  try {
    let url = `https://googleapis.com{encodeURIComponent(text)}`;
    let response = await fetch(url);
    let data = await response.json();
    if (data && data[0]) {
      let result = "";
      for (let i = 0; i < data[0].length; i++) {
        if (data[0][i][0]) result += data[0][i][0];
      }
      return result;
    }
  } catch (e) {
    // ఆన్‌లైన్ లభ్యం కాకపోతే లోకల్ డిక్షనరీ చెక్ చేస్తుంది
    for (let key in LANGUAGE_TRANSLITERATOR) {
      if (text.includes(key)) {
        return text.replace(new RegExp(key, 'g'), LANGUAGE_TRANSLITERATOR[key]);
      }
    }
  }
  return text;
}

async function advancedTeluguClean() {
  let text = document.getElementById("in").value;
  if (!text.trim()) {
    alert("దయచేసి టెక్స్ట్ బాక్స్‌లో కంటెంట్ పేస్ట్ చేయండి!");
    return;
  }

  let btn = document.getElementById("cleanBtn");
  let outputDiv = document.getElementById("out");
  let statusBox = document.getElementById("statusBox");
  
  btn.innerText = "⏳ అక్షరాలను విశ్లేషిస్తోంది...";
  btn.disabled = true;
  statusBox.style.display = "block";
  statusBox.innerText = "🔍 అన్యభాషలను తెలుగులోకి మారుస్తూ, అక్షరాలను జోడిస్తోంది...";

  // 1. యూనికోడ్ నార్మలైజేషన్
  let cleanText = text.normalize("NFC");

  // 2. విడిపోయిన హల్లులు మరియు గుణింత గుర్తుల మధ్య ఉన్న స్పేస్‌లను తొలగించడం
  let oldText;
  do {
    oldText = cleanText;
    cleanText = cleanText.replace(/([\u0C00-\u0C7F])\s+([\u0C3E-\u0C4D\u0C01-\u0C03\u0C55\u0C56])/gu, '\$1\$2');
  } while (cleanText !== oldText);

  // 3. విడిపోయిన 'ర' వత్తులు మరియు కామన్ తప్పుల ప్రాథమిక ఫిక్స్
  cleanText = cleanText.replace(/ర\s*్\s*ా/gu, "్రా");
  cleanText = cleanText.replace(/ర\s*్\s*ి/gu, "్రి");
  cleanText = cleanText.replace(/ర\s*్\s*ే/gu, "くれた");
  cleanText = cleanText.replace(/ర\s*్\s*ో/gu, "్రో");
  cleanText = cleanText.replace(/ర\s*్\s*సా\s*రు/gu, "రాసారు"); 
  cleanText = cleanText.replace(/జీ\s*వి\s*త\s*్\s*ో\s*్\s*ని/gu, "జీవితాన్ని");
  cleanText = cleanText.replace(/అధ్వయయిం/gu, "అధ్యాయం");
  cleanText = cleanText.replace(/అధ్యాయిం/gu, "అధ్యాయం");
  cleanText = cleanText.replace(/గొప/g, "గొప్ప");

  // 4. 🧠 ఇంటెలిజెంట్ వర్డ్ మెర్జర్ లాజిక్ (స్పేస్‌లు ఉన్న పదాలను కలపడం)
  let tokens = cleanText.split(/(\s+)/);
  for (let i = 0; i < tokens.length; i++) {
    if (/\s+/.test(tokens[i])) continue;
    
    let nextIdx = i + 2;
    if (nextIdx < tokens.length) {
      let curr = tokens[i];
      let next = tokens[nextIdx];
      
      let isTeluguCurr = /^[\u0C00-\u0C7F]+\$/.test(curr.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      let isTeluguNext = /^[\u0C00-\u0C7F]+$/.test(next.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,""));
      
      if (isTeluguCurr && isTeluguNext) {
        if (curr.length <= 3 || next.length <= 3 || next === "లు" || next === "ని" || next === "తో" || next === "అని") {
          tokens[i] = curr + next;
          tokens[nextIdx] = "";
          tokens[i + 1] = ""; 
          i -= 2;
          if (i < -1) i = -1;
        }
      }
    }
  }
  cleanText = tokens.join("");

  // 5. 🌐 విదేశీ/అన్యభాషల పదాల అనువాద ప్రక్రియ (ఇంగ్లీష్ కాకుండా)
  // రష్యన్ లేదా హిందీ ముక్కలు కనపడితే ఆటోమేటిక్‌గా వాటిని తెలుగు అర్థంలోకి మారుస్తుంది
  if (/[\u0400-\u04FF\u0900-\u097F\u0600-\u06FF]/.test(cleanText)) {
    cleanText = await translateForeignToTelugu(cleanText);
  }

  // డబుల్ స్పేస్ క్లీనప్
  cleanText = cleanText.replace(/\s+/g, " ");

  // అవుట్‌పుట్ చూపించడం
  outputDiv.innerText = cleanText.trim();
  statusBox.innerText = "✨ కన్వర్షన్ మరియు క్లీనప్ విజయవంతంగా పూర్తయింది!";
  btn.innerText = "✨ అన్ని తప్పులను సరిచేయి";
  btn.disabled = false;
}

function copyText() {
  let text = document.getElementById("out").innerText;
  if(text.startsWith("సరిదిద్దబడిన")) return;
  navigator.clipboard.writeText(text).then(() => {
    alert("📋 కంటెంట్ విజయవంతంగా కాపీ అయింది!");
  });
}
</script>

</body>
</html>
