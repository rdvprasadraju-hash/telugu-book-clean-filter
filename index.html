<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>సార్వత్రిక తెలుగు అక్షర క్లీనర్ v134.0</title>
<!-- PWA మొబైల్ సపోర్ట్ మెటా ట్యాగ్‌లు -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; background: #f4f6f9; color: #212529; }
  .box { width: 100%; max-width: 850px; margin: 10px auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e9ecef; box-sizing: border-box; }
  h2 { text-align: center; color: #0f5132; margin-top: 0; font-size: 22px; font-weight: 700; }
  textarea { width: 100%; height: 200px; padding: 12px; font-size: 16px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; resize: vertical; transition: border-color 0.2s; }
  textarea:focus { border-color: #0f5132; outline: none; }
  .output { background: #fffdf5; border: 1px solid #fce8b2; min-height: 200px; padding: 15px; font-size: 18px; border-radius: 8px; margin-top: 15px; line-height: 1.8; color: #1a1a1a; overflow-x: auto; box-sizing: border-box; }
  .btn-container { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  button { flex: 1; min-width: 150px; padding: 14px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .btn-clean { background: #0f5132; }
  .btn-clean:hover { background: #146c43; }
  .btn-clean:disabled { background: #6c757d; cursor: not-allowed; }
  .status { background: #d1e7dd; color: #0f5132; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; border: 1px solid #badbcc; font-size: 14px; }
  
  /* 🚨 అంతచిక్కని పదాల కోసం స్పెషల్ ప్రొఫెషనల్ రెడ్ అలర్ట్ స్టైలింగ్ */
  .unknown-error-word { color: #dc3545; font-weight: bold; background: #fff5f5; border: 1px dashed #dc3545; padding: 2px 8px; border-radius: 4px; display: inline-block; margin: 0 2px; }
  .alert-symbol { margin-left: 5px; font-size: 13px; color: #dc3545; vertical-align: middle; font-weight: 600; }
</style>
</head>
<body>

<div class="box">
  <h2>📚 సార్వత్రిక తెలుగు అక్షర క్లీనర్ v134.0 (సార్వత్రిక యాప్)</h2>
  <div id="statusBox" class="status"></div>
  <textarea id="in" placeholder="ల్యాప్‌టాప్ లేదా ఫోన్ నుండి కంటెంట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
  
  <div class="btn-container">
    <button id="cleanBtn" class="btn-clean" onclick="runSoftwarePipeline()">✨ అన్ని తప్పులను సరిచేయి</button>
    <button style="background:#0d6efd; color:white;" onclick="copyCleanedContent()">📋 టెక్స్ట్ కాపీ చేయి</button>
  </div>
  
  <div id="out" class="output">సరిదిద్దబడిన స్పష్టమైన తెలుగు కంటెంట్ ఇక్కడ కనిపిస్తుంది...</div>
</div>

<script>
// 🧠 లోకల్ కోర్ నిఘంటువు (కామన్ OCR దోషాల స్థానిక శుద్ధి)
const SYSTEM_CORE_DICT = {
  "అధ్వయయిం": "అధ్యాయం",
  "అధ్యాయిం": "అధ్యాయం",
  "గొప": "గొప్ప"
};

// 🌐 గూగుల్ అఫీషియల్ లైవ్ క్లౌడ్ నిఘంటువు గేట్‌వే (CORS ఫ్రీ బ్రౌజర్ ఛానల్)
async function requestLiveTranslation(wordPayload) {
  try {
    let targetUrl = "https://google.com" + encodeURIComponent(wordPayload);
    let response = await fetch(targetUrl);
    let responseData = await response.json();
    
    if (responseData) {
      if (Array.isArray(responseData) && responseData[0]) {
        return responseData[0];
      }
      if (typeof responseData === 'string') {
        return responseData;
      }
    }
  } catch (netError) {
    console.error("Cloud Gateway Net Error: ", netError);
  }
  return null; 
}

async function runSoftwarePipeline() {
  let userInput = document.getElementById("in").value;
  if (!userInput.trim()) {
    alert("దయచేసి టెక్స్ట్ బాక్స్‌లో కంటెంట్ పేస్ట్ చేయండి!");
    return;
  }

  let processBtn = document.getElementById("cleanBtn");
  let outputPanel = document.getElementById("out");
  let statusBox = document.getElementById("statusBox");
  
  processBtn.innerText = "⏳ సాఫ్ట్‌వేర్ రన్ అవుతోంది...";
  processBtn.disabled = true;
  statusBox.style.display = "block";
  statusBox.innerText = "🔍 సర్జికల్ ఇండెక్స్ రీప్లేస్మెంట్ ఇంజన్ రన్ అవుతోంది. తెలుగు అక్షరాలు 100% సురక్షితం...";

  let architectureText = userInput.normalize("NFC");

  let stateCheckpoint;
  do {
    stateCheckpoint = architectureText;
    architectureText = architectureText.replace(/([\u0C00-\u0C7F])\s+([\u0C3E-\u0C4D\u0C01-\u0C03\u0C55\u0C56])/gu, '\$1\$2');
  } while (architectureText !== stateCheckpoint);

  architectureText = architectureText.replace(/ర\s*్\s*ా/gu, "్రా");
  architectureText = architectureText.replace(/ర\s*్\s*ి/gu, "్రి");
  architectureText = architectureText.replace(/ర\s*్\s*ే/gu, "్రె");
  architectureText = architectureText.replace(/ర\s*్\s*ో/gu, "్రో");
  architectureText = architectureText.replace(/ర\s*్\s*సా\s*రు/gu, "రాశారు");
  architectureText = architectureText.replace(/శ\s*క్\s*్\s*తి/gu, "శక్తి");
  architectureText = architectureText.replace(/జీ\s*వి\s*త\s*్\s*ో\s*్\s*ని/gu, "జీవితాన్ని");
  architectureText = architectureText.replace(/ప్ర\s*క\s*ృ\s*తి\s*ని/gu, "ప్రకృతిని");
  architectureText = architectureText.replace(/ప్ర\s*శ\s*్\s*న\s*లు/gu, "ప్రశ్నలు");
  architectureText = architectureText.replace(/చె\s*ప్\s*ప\s*ా\s*ల\s*ి/gu, "చెప్పాలి");
  architectureText = architectureText.replace(/ఉ\s*జ\s*్\s*జ\s*్వ\s*ల\s*ం\s*గా/gu, "ఉజ్జ్వలంగా");
  architectureText = architectureText.replace(/చే\s*యా\s*లి/gu, "చేయాలి");

  let initialTokens = architectureText.split(/(\s+)/);
  for (let idx = 0; idx < initialTokens.length; idx++) {
    if (/\s+/.test(initialTokens[idx])) continue;
    let lookAheadIdx = idx + 2;
    if (lookAheadIdx < initialTokens.length) {
      let current = initialTokens[idx];
      let forward = initialTokens[lookAheadIdx];
      let isTelCurrent = /^[\u0C00-\u0C7F]+\$/.test(current.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      let isTelForward = /^[\u0C00-\u0C7F]+\$/.test(forward.replace(/[.,\/#!\)%\^&\*;:{}=\-_`~()]/g,""));
      
      if (isTelCurrent && isTelForward) {
        if (current.length <= 2 || forward.length <= 2 || ["లు","ని","తో","అని","ను"].includes(forward)) {
          initialTokens[idx] = current + forward;
          initialTokens[lookAheadIdx] = "";
          initialTokens[idx + 1] = ""; 
          idx -= 2;
          if (idx < -1) idx = -1;
        }
      }
    }
  }
  architectureText = initialTokens.join("");

  let wordsArray = architectureText.split(/(\s+)/);
  for (let i = 0; i < wordsArray.length; i++) {
    let activeWord = wordsArray[i];
    
    if (activeWord.trim().length > 0 && !/\s+/.test(activeWord)) {
      let punctuationPrefix = activeWord.match(/^[.,\/#!$%\^&\*;:{}=\-_`~()]+/g) || "";
      let punctuationSuffix = activeWord.match(/[.,\/#!\$%\^&\*;:{}=\-_`~()]+$/g) || "";
      
      let cleanWord = activeWord.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").trim();
      
      if (/[\d+\-*\/=^<>]/.test(activeWord)) {
        continue; 
      }
      
      if (/^[a-zA-Z]+\$/.test(cleanWord)) {
        continue; 
      }
      
      if (/[\u0900-\u097F\u0400-\u04FF\u0600-\u06FF\u4e00-\u9fa5]/u.test(cleanWord) || 
          (/[a-zA-Z]/.test(cleanWord) && /[\u0C00-\u0C7F]/.test(cleanWord))) {
        
        statusBox.innerText = "🌐 అన్యభాషను సురక్షితంగా అనువదిస్తోంది: " + cleanWord + "...";
        let targetPayload = cleanWord.replace(/[\u0C4D]/g, "");
        let fullyTranslatedWord = await requestLiveTranslation(targetPayload);
        
        if (fullyTranslatedWord === null || fullyTranslatedWord === "" || fullyTranslatedWord === cleanWord) {
          wordsArray[i] = punctuationPrefix + '<span class="unknown-error-word">' + cleanWord + '<span class="alert-symbol">⚠️ సరిచేసుకోండి</span></span>' + punctuationSuffix;
        } else {
          wordsArray[i] = punctuationPrefix + fullyTranslatedWord + punctuationSuffix;
        }
      }
    }
  }
  architectureText = wordsArray.join("");

  for (let errorPattern in SYSTEM_CORE_DICT) {
    let regexInstance = new RegExp(errorPattern, 'g');
    architectureText = architectureText.replace(regexInstance, SYSTEM_CORE_DICT[errorPattern]);
  }

  architectureText = architectureText.replace(/\s+/g, " ");
  outputPanel.innerHTML = architectureText.trim();
  statusBox.style.display = "none";
  processBtn.innerText = "✨ అన్ని తప్పులను సరిచేయి";
  processBtn.disabled = false;
}

function copyCleanedContent() {
  const outputPanel = document.getElementById("out");
  if(outputPanel.innerText.startsWith("సరిదిద్దబడిన")) return;
  let pureText = outputPanel.innerText.replace(/⚠️ సరిచేసుకోండి/g, "");
  navigator.clipboard.writeText(pureText).then(function() {
    alert("📋 కంటెంట్ విజయవంతంగా క్లిప్‌బోర్డ్‌లోకి కాపీ చేయబడింది!");
  }).catch(function(err) {
    alert("కాపీ చేయడం కుదరలేదు, దయచేసి మాన్యువల్‌గా కాపీ చేసుకోండి.");
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log("PWA SW Protected"));
  });
}
</script>
</body>
</html>
