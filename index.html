<style>

function smartUnicodeRepair(text) {
  if (!text) return "";
  text = text.replace(/⚠️\[సరిచూసుకోండి\]/g, "");
  text = text.normalize("NFC");

  text = text.replace(/[\u0900-\u097F]/g, "");

  // 2. పాత తెలుగు అంకెలను అంతర్జాతీయ అంకెలుగా మార్చడం

    return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
  });

function processBookPublishing() {
  let rawInput = document.getElementById("rough").value;
  if (!rawInput) return;

  let cleanedText = smartUnicodeRepair(rawInput);
  let lines = cleanedText.split("\n");
  
  let finalMergedLines = [];
  let buffer = "";

  // 🌟 లూప్ వేరియబుల్స్ పూర్తిగా 100% పక్కాగా లాక్ చేయబడ్డాయి (k < lines.length)
  for (let k = 0; k < lines.length; k++) {
    let sLine = lines[k];
    if (sLine === undefined || sLine === null) continue;
    let t = sLine.trim();
    if (!t) {
      if (buffer) { finalMergedLines.push(buffer); buffer = ""; }
      finalMergedLines.push(""); 
      continue;
    }
