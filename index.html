<head>

<style>

  .sidebar {

  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }

    width: 100%; flex: 1; background-color: #fffdf6; border: 1px solid var(--border-color); border-radius: 8px;

  <h1>📚 తెలుగు బుక్ లేఅవుట్ & ఆటో-కరెక్షన్ ప్రో</h1>
</header>

<div class="workspace">
  <div class="sidebar">
    <div class="panel-section">
      <button class="action-btn btn-primary" onclick="processBookPublishing()">✨ లేఅవుట్ రన్ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn btn-secondary" onclick="copyText()">📋 టెక్స్ట్ కాపీ చేయి</button>
      <div style="height: 8px;"></div>
      <button class="action-btn style='background-color:#dc3545; color:white;'" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>
    </div>
  </div>

  <div class="main-editor">
    <div class="editor-block">
      <textarea id="rough" placeholder="మీ పుస్తకం రఫ్ టెక్స్ట్‌ను ఇక్కడ పేస్ట్ చేయండి..."></textarea>
    </div>
    <div class="editor-block">
      <div id="cleanContainer" class="premium-preview">సరిదిద్దబడిన టెక్స్ట్ ఇక్కడ కనిపిస్తుంది...</div>
    </div>
  </div>
</div>

<textarea id="clean" style="display:none;"></textarea>

<script>

  "పరయాణవనిి": "ప్రయాణాన్ని", "విశ్ా": "విశ్వ", "ముగషించే": "ముగించే",
  "పర్షణవమ": "పరిణామ", "ధరమిం": "ధర్మం", "ధరమ██నం": "ధర్మశాసనం",
  "ధరమ██సనం": "ధర్మశాసనం", "ధరమశ్వసనం": "ధర్మశాసనం", "శూనయ": "శూన్య",
  "స్టథతిలో": "స్థితిలో", "విశ్వవనిi": "విశ్వాన్ని", "కవంతి": "కాంతి",
  "వేగంగవ": "వేగంగా", "నెటేిస్టన": "నెట్టేసిన", "ర్షవ్ర్్": "రివర్స్",
  "శ్క్ిత": "శక్తి", "ఆవేశ్ంతోనెైతే": "ఆవేశంతోనైతే", "ప్్వారంభంచందో": "ప్రారంభించిందో",
  "ఇపపుడు": "ఇప్పుడు", "యొकక": "యొక్క", "అశ్వంతిని": "అశాంతిని",
  "క్రూరతావనిి": "క్రూరత్వాన్ని", "స్టదధమవపతోంది": "సిద్ధమవుతోంది",
  "శ్కతు": "శక్తుల", "ఘరషణ": "ఘర్షణ", "కోటల": "కోట్ల", "సంవతసరవల": "సంవత్సరాల",
  "तरవవత": "తర్వాత", "తరవవత": "తర్వాత", "మేధసుసగవ": "మేధస్సుగా",
  "పాశ్వంత": "ప్రశాంత", "పాశ్వంతంగవ": "ప్రశాంతంగా", "స్టథти": "స్థితి",
  "స్టథతి": "స్థితి", "వెైపప": "వైపు", "అడుగులత": "అడుగులు", "వేస్ు": "వేస్తోంది",
  "శ్తాబదపప": "శతాబ్దపు", "పెదద": "పెద్ద", "ఉదయం": "ఉదయం", "ఇలలంతా": "ఇల్లంతా",
  "గందరగోళ్ం": "గందరగోళం", "గందరగోళిం": "గందరగోళం", "శ్బ్ద": "శబ్ద",

  "ఉంట": "ఉంటుంది", "కవనీ": "కానీ", "రవతిా": "రాత్రి", "అయ్యయసరికి": "అయ్యేసరికి",
  "ముగిస్ట": "ముగిసి", "వెళ్లులప్్": "వెళ్లిపోయాక", "వెళ్లలప్్": "వెళ్లిపోయాక",

  "ఆవిरవావంతో": "ఆవిర్భావంతో", "పావృతుు": "ప్రవృత్తుల", "అంతమ": "అంతమై",
  "పరిపూరణమ": "పరిపూర్ణమైన", "వెైజఞా": "వైజ్ఞానిక", "చేరుకతంట": "చేరుకుంటుంది",

  "పరామతో": "ప్రేమతో", "తీరుు": "తీర్పు", "రచయ్తగవ": "రచయితగా",
  "సమాజఞనికి": "సమాజానికి", "అధ్వయయిం": "అధ్యాయం", "అధ్యాయం": "అధ్యాయం",
  "పరిమితులు": "పరిమితులు", "మర్షయు": "మరియు", "అలాార్షథమిక్": "అల్గారిథమిక్",
  "సవాళుల": "సవాళ్లు"
};

function processBookPublishing() {
  let rawInput = document.getElementById("rough").value;
  if (!rawInput) return;

  let lines = rawInput.split("\n");
  let htmlOutput = [];
  let rawTextOutput = [];

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (!line.trim()) {
      htmlOutput.push("<br>");
      rawTextOutput.push("");
      continue;
    }

    let words = line.split(/\s+/);
    let processedWords = [];

    for (let j = 0; j < words.length; j++) {
      let word = words[j];
      if (!word) continue;

      let cleanWord = word.replace(/[.,!?()]/g, "");
      let punctuationBefore = word.match(/^[(]*/) ? word.match(/^[(]*/) : "";
      let punctuationAfter = word.match(/[.,!?)]*$/) ? word.match(/[.,!?)]*$/) : "";

      if (spellingFixes[cleanWord]) {
        cleanWord = spellingFixes[cleanWord];
      }
      processedWords.push(punctuationBefore + cleanWord + punctuationAfter);
    }

    let cleanLine = processedWords.join(" ");
    rawTextOutput.push(cleanLine);
    htmlOutput.push("<div>" + cleanLine + "</div>");
  }

  document.getElementById("cleanContainer").innerHTML = htmlOutput.join("");
  document.getElementById("clean").value = rawTextOutput.join("\n");
}

async function copyText() {
  const output = document.getElementById("clean");
  if (!output.value) return;
  await navigator.clipboard.writeText(output.value);
  alert("టెక్స్ట్ విజయవంతంగా కాపీ అయింది!");
}

function clearText() {
  document.getElementById("rough").value = "";
  document.getElementById("cleanContainer").innerHTML = "సриదిద్దబడిన టెక్స్ట్ ఇక్కడ కనిపిస్తుంది...";
  document.getElementById("clean").value = "";
}
</script>
</body>
</html>
