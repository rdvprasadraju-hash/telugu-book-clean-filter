<html lang="te">

<title>తెలుగు బుక్ లేఅవుట్ & పబ్లిషింగ్ ప్రో v10.0</title>
<style>
  :root {
    --primary: #0f5132;
    --primary-hover: #146c43;
    --bg-light: #f8f9fa;
    --border-color: #dee2e6;
  }
  body {
    font-family: 'Mandali', 'Pothana', 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f1f3f5;
    color: #212529;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background-color: var(--primary);
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 22px; }
  .workspace { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 280px;
    background-color: white;
    border-right: 1px solid var(--border-color);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .panel-section {
    background-color: var(--bg-light);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
  }
  .action-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    color: white;
  }
  .btn-primary { background-color: var(--primary); }
  .btn-secondary { background-color: #6c757d; }
  .btn-info { background-color: #0d6efd; }
  .btn-danger { background-color: #dc3545; }
  
  .main-editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
    gap: 15px;
  }
  .editor-block { display: flex; flex-direction: column; flex: 1; }
  textarea {
    width: 100%;
    flex: 1;
    padding: 16px;
    font-size: 16px;
    line-height: 1.7;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    resize: none;
  }
  
  .premium-preview {
    width: 100%;
    flex: 1;
    background-color: #fffdf6;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 35px;
    box-sizing: border-box;
    font-size: 19px;
    line-height: 2.0;
    white-space: pre-wrap;
    overflow-y: auto;
  }
  
  /* పీడీఎఫ్ సెంటర్ లేఅవుట్ రూల్స్ */
  .main-chapter {
    font-size: 32px;
    font-weight: bold;
    color: var(--primary);
    text-align: center;
    margin-top: 30px;
    margin-bottom: 15px;
    display: block;
  }
  .book-heading {
    font-size: 26px;
    font-weight: bold;
    color: #198754;
    text-align: center;
    margin-top: 20px;
    margin-bottom: 25px;
    display: block;
  }
  .sub-heading {
    font-size: 22px;
    font-weight: bold;
    color: #343a40;
    margin-top: 20px;
    margin-bottom: 12px;
    display: block;
    border-left: 4px solid var(--primary);
    padding-left: 10px;
  }
  .book-paragraph {
    margin-bottom: 18px;
    text-align: justify;
  }
  /* ప్రింట్ సెట్టింగ్స్ */
  @media print {
    body * { visibility: hidden; }
    #cleanContainer, #cleanContainer * { visibility: visible; }
    #cleanContainer { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 0; }
  }
</style>

</header>

      <div style="height: 8px;"></div>

      <div style="height: 8px;"></div>

      <div style="height: 8px;"></div>
      <button class="action-btn btn-danger" onclick="clearText()">🗑️ క్లియర్ బోర్డు</button>

  </div>

  <div class="main-editor">

      <div id="cleanContainer" class="premium-preview">పీడీఎఫ్ తరహా అంతర్జాతీయ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...</div>
    </div>

// ఆటో-సేవ్ డ్రాఫ్ట్ ఫంక్షన్
function saveDraft() {
  localStorage.setItem("rough_draft", document.getElementById("rough").value);
}

// పేజీ ఓపెన్ అవ్వగానే పాత డేటా లోడ్ చేయడం
window.onload = function() {
  let saved = localStorage.getItem("rough_draft");
  if(saved) {
    document.getElementById("rough").value = saved;
  }
};

function processBookPublishing() {
  let rawInput = document.getElementById("rough").value;
  if (!rawInput) return;

  rawInput = rawInput.replace(/⚠️\[సరిచూసుకోండి\]/g, "");

  let lines = rawInput.split("\n");
  let htmlOutput = [];
  let rawTextOutput = [];

  for (let line of lines) {
    let trimmedLine = line.trim();
    if (!trimmedLine) {
      htmlOutput.push("<br>");
      rawTextOutput.push("");
      continue;
    }

    let isMainChapter = /^(అధ్యాయం|అధ్వయయిం|Chapter)/i.test(trimmedLine);
    let isBookHeading = /^(శీర్షిక|శీరిషిక|Title)/i.test(trimmedLine);
    let isSubHeading = /^(ఉప శీర్షిక|ఉపశీర్షిక|సూపర్ ఏఐ|అింతిమ|ఆమ|Sub|Section)/i.test(trimmedLine);

    line = line.replace(/ఊహ\s+ంచుకతందాం/g, "ఊహించుకుందాం");
    line = line.replace(/బిగ్\s+బ్యంగ్/g, "బిగ్ బ్యాంగ్");

    let words = line.split(/\s+/);
    let processedWords = [];

    for (let i = 0; i < words.length; i++) {
      let word = words[i];
      if (!word) continue;

      word = word.replace(/[\u0C66-\u0C6F]/gu, function(ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0x0C66 + 48);
      });

      if (word.startsWith("(") || word.endsWith(")") || /\(.*\)/.test(word)) {
        processedWords.push(word);
        continue;
      }

      let cleanWord = word.replace(/[.,!?()]/g, "");
      let punctuationBefore = word.match(/^[(]*/) ? word.match(/^[(]*/) : "";
      let punctuationAfter = word.match(/[.,!?)]*$/) ? word.match(/[.,!?)]*$/) : "";

      if (spellingFixes[cleanWord]) {
        cleanWord = spellingFixes[cleanWord];
      }
      
      processedWords.push(punctuationBefore + cleanWord + punctuationAfter);
    }

    let cleanLine = processedWords.join(" ");
    cleanLine = cleanLine.replace(/[ \t]+/g, " ");
    
    let finalLine = cleanLine.trim();
    rawTextOutput.push(finalLine);

    if (isMainChapter) {
      htmlOutput.push("<span class='main-chapter'>" + finalLine + "</span>");
    } else if (isBookHeading) {
      htmlOutput.push("<span class='book-heading'>" + finalLine + "</span>");
    } else if (isSubHeading) {
      htmlOutput.push("<span class='sub-heading'>" + finalLine + "</span>");
    } else {
      htmlOutput.push("<div class='book-paragraph'>" + finalLine + "</div>");
    }
  }

  document.getElementById("cleanContainer").innerHTML = htmlOutput.join("");
  document.getElementById("clean").value = rawTextOutput.join("\n");
}

async function copyText() {
  const output = document.getElementById("clean");
  if (!output.value) return;
  await navigator.clipboard.writeText(output.value);
  alert("ప్యానెల్ టెక్స్ట్ విజయవంతంగా కాపీ అయింది!");
}

function clearText() {
  document.getElementById("rough").value = "";
  document.getElementById("cleanContainer").innerHTML = "పీడీఎఫ్ తరహా అంతర్జాతీయ లేఅవుట్ ఇక్కడ ప్రత్యక్షమవుతుంది...";
